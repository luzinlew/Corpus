function clean(o){const r={};for(const k in o){if(k==='id'||k==='url'||k[0]==='_')continue;r[k]=o[k];}return JSON.parse(JSON.stringify(r));}
/* a name or hint typed on one photo of a linked label is the name/hint of the whole group */
const GRP_SHARED=['term','hint','hintLeft','hintSnooze'];let GRP_BUSY=false;
function persist(coll,id){
  if(coll==='terms'&&!GRP_BUSY){const c=cardById(id);if(c&&c.grp){GRP_BUSY=true;try{grpMates(c).forEach(o=>{let ch=false;GRP_SHARED.forEach(k=>{if(o[k]!==c[k]){if(c[k]===undefined)delete o[k];else o[k]=c[k];ch=true;}});if(ch)persist('terms',o.id);});}finally{GRP_BUSY=false;}}}
  if(!S.db)return;
  if(coll==='terms'){const c=cardById(id);if(c&&c._pk){packTouch(c);return;}}
  if(coll==='plates'&&isLocalPlate(id))return;
  if(coll==='terms'){const c=cardById(id);if(c&&isLocalPlate(c.plateId))return;}
  enq(coll+'/'+id,{coll:coll,id:id,op:'set'});
}
function removeDoc(coll,id){if(S.db)enq(coll+'/'+id,{coll:coll,id:id,op:'del'});}
function afterWrites(fn){enq('fn/'+Math.random(),{op:'fn',fn:fn});}
function enq(k,job){if(!WQ.jobs.has(k))WQ.keys.push(k);WQ.jobs.set(k,job);pump();}
/* where the storage can take many documents in one request (S.db.setMany — the website), consecutive
   writes of whole documents go out together: an import saves hundreds of photos and packs in a few
   round trips instead of one per document. Partial pack updates and deletions keep going one by one. */
const BATCH_MAX=100,BATCH_BYTES=1500000;
function batchable(job){
  if(!job)return false;
  if(job.op==='set')return true;
  if(job.op==='pset'){const P=PACKS.get(job.id);return !!(P&&!P.saved);}
  return false;
}
async function pump(){
  if(WQ.busy)return;WQ.busy=true;
  while(WQ.keys.length){
    const k=WQ.keys.shift();const job=WQ.jobs.get(k);WQ.jobs.delete(k);if(!job)continue;
    if(S.db&&S.db.setMany&&!job.single&&batchable(job)&&batchable(WQ.jobs.get(WQ.keys[0]))){await pumpBatch(k,job);continue;}
    try{
      if(job.op==='fn'){await job.fn();continue;}
      if(job.op==='pset'){await packWrite(job.id);WQ.retries.delete(k);continue;}
      const ref=S.db.collection(job.coll).doc(job.id);
      if(job.op==='del')await ref.delete();
      else{const o=getObj(job.coll,job.id);if(o)await ref.set(clean(o));}

function pumpFail(k,job,e){
  const code=e&&e.code;const n=WQ.retries.get(k)||0;

  else saveFailed(code);
}
async function pumpBatch(k0,job0){
  const items=[],after=[],taken=[];let bytes=0;
  const add=(k,job)=>{
    taken.push([k,job]);
    if(job.op==='pset'){
      const P=PACKS.get(job.id);const body=packBody(job.id);if(!P||!body)return;
      P.dirty.clear();P.del.clear();   /* what changes during the request stays dirty for the next write */
      items.push({coll:'packs',id:job.id,data:body});bytes+=JSON.stringify(body).length;
      after.push(()=>{P.saved=true;P.kset=new Map(Object.keys(body.c).map(id=>[id,Object.keys(body.c[id])]));});return;
    }
    const o=getObj(job.coll,job.id);if(!o)return;const d=clean(o);items.push({coll:job.coll,id:job.id,data:d});bytes+=JSON.stringify(d).length;

  add(k0,job0);
  while(WQ.keys.length&&items.length<BATCH_MAX&&bytes<BATCH_BYTES){
    const k=WQ.keys[0];const job=WQ.jobs.get(k);if(!job||job.single||!batchable(job))break;
    WQ.keys.shift();WQ.jobs.delete(k);add(k,job);
  }
  if(!items.length)return;
  try{await S.db.setMany(items);after.forEach(f=>f());taken.forEach(t=>WQ.retries.delete(t[0]));}
  catch(e){
    if(e&&e.code==='unavailable'){taken.forEach(t=>pumpFail(t[0],t[1],e));return;}
    /* the batch was refused as a whole: write these one by one, so each document's own error is seen */
    taken.slice().reverse().forEach(t=>{t[1].single=true;if(!WQ.jobs.has(t[0])){WQ.keys.unshift(t[0]);WQ.jobs.set(t[0],t[1]);}});

function saveFailed(code){
  if(code==='quota_exceeded'){toast('Хранилище заполнено — удалите ненужные фото или карточки.');return;}
  if(!S.saveErr){S.saveErr=true;toast('Не удалось сохранить изменения. Проверьте соединение.');}

/* ---------- Anki-style scheduler (SM-2 with learning steps) ---------- */
const LEARN=[1,10],RELEARN=[10];

function fR(t,st){return Math.pow(1+F_FACTOR*t/st,F_DECAY);}

function fState(mem,t,g){
  if(!mem)return {d:fInitD(g),s:fInitS(g)};

  return {d:d,s:g===1?fForgetS(mem.d,mem.s,R):fRecallS(mem.d,mem.s,R,g)};

function fRet(){return clamp(META.retention||0.9,0.7,0.99);}
function fIvl(st){const m=(Math.pow(fRet(),1/F_DECAY)-1)/F_FACTOR;return Math.min(36500,Math.max(1,Math.round(st*m)));}

/* memory state of a card; cards learned with the old SM-2 scheduler are converted from ease + interval */
function fMem(c){

  if(c.type==='new')return null;
  const d=fClampD(5+(2.5-(c.ease||2.5))*3.75);
  if(c.type==='review'||c.type==='relearn')return {s:Math.max(c.ivl||1,0.5),d:d};

function fLast(c,now){if(c.lr)return c.lr;if(c.last)return c.last;if(c.type==='review'&&c.due)return c.due-(c.ivl||1)*DAYMS;return now;}

function scheduleFSRS(c,r,now){

  const mem=c.type==='new'?null:fMem(c);const t=mem?fDays(fLast(c,now),now):0;
  const st=fState(mem,t,r);s.fs=fx8(st.s);s.fd=fx8(st.d);s.lr=now;
  const seed=c.id+':'+(c.reps||0);
  const grad=S=>{s.type='review';s.step=0;s.ivl=fFuzz(fIvl(S),seed);s.due=addDays(now,s.ivl);};
  if(c.type==='new'||c.type==='learn'){
    const step=c.type==='new'?0:c.step;
    if(r===1){s.type='learn';s.step=0;s.due=now+LEARN[0]*MIN;}
    else if(r===2){s.type='learn';s.step=step;const d=(step===0&&LEARN.length>1)?(LEARN[0]+LEARN[1])/2:LEARN[step];s.due=now+d*MIN;}

    else grad(st.s);
  }else if(c.type==='relearn'){
    if(r===1){s.step=0;s.due=now+RELEARN[0]*MIN;}
    else if(r===2){s.due=now+RELEARN[Math.min(c.step,RELEARN.length-1)]*1.5*MIN;}
    else if(r===3&&c.step+1<RELEARN.length){s.step=c.step+1;s.due=now+RELEARN[s.step]*MIN;}
    else grad(st.s);
  }else{
    if(r===1){s.lapses=(c.lapses||0)+1;s.type='relearn';s.step=0;s.ivl=1;s.due=now+RELEARN[0]*MIN;}

function schedule(c,r,now){now=now||Date.now();return META.algo==='sm2'?scheduleSM2(c,r,now):scheduleFSRS(c,r,now);}
function scheduleSM2(c,r,now){

  if(c.type==='new'||c.type==='learn'){
    const step=c.type==='new'?0:c.step;
    if(r===1){s.type='learn';s.step=0;s.due=now+LEARN[0]*MIN;}
    else if(r===2){s.type='learn';s.step=step;const d=(step===0&&LEARN.length>1)?(LEARN[0]+LEARN[1])/2:LEARN[step];s.due=now+d*MIN;}
    else if(r===3){if(step+1<LEARN.length){s.type='learn';s.step=step+1;s.due=now+LEARN[step+1]*MIN;}else{s.type='review';s.step=0;s.ivl=1;s.due=addDays(now,1);}}
    else{s.type='review';s.step=0;s.ivl=4;s.due=addDays(now,4);}
  }else if(c.type==='relearn'){
    if(r===1){s.step=0;s.due=now+RELEARN[0]*MIN;}
    else if(r===2){s.due=now+RELEARN[Math.min(c.step,RELEARN.length-1)]*1.5*MIN;}
    else if(r===3){if(c.step+1<RELEARN.length){s.step=c.step+1;s.due=now+RELEARN[s.step]*MIN;}else{s.type='review';s.step=0;s.ivl=Math.max(1,c.ivl);s.due=addDays(now,s.ivl);}}
    else{s.type='review';s.step=0;s.ivl=Math.max(1,c.ivl)+1;s.due=addDays(now,s.ivl);}
  }else{
    const ivl=Math.max(1,c.ivl);
    if(r===1){s.lapses=c.lapses+1;const chronic=Math.min(0.15,(c.lapses||0)*0.02);s.ease=Math.max(1.3,c.ease-0.2-chronic);s.ivl=1;s.type='relearn';s.step=0;s.due=now+RELEARN[0]*MIN;}
    else if(r===2){s.ease=Math.max(1.3,c.ease-0.15);s.ivl=Math.max(ivl+1,Math.round(ivl*1.2));s.due=addDays(now,s.ivl);}
    else if(r===3){s.ivl=Math.max(ivl+1,Math.round(ivl*c.ease));s.due=addDays(now,s.ivl);}
    else{const good=Math.max(ivl+1,Math.round(ivl*c.ease));s.ease=c.ease+0.15;s.ivl=Math.max(good+1,Math.round(ivl*c.ease*1.3));s.due=addDays(now,s.ivl);}
  }

}

/* weakness score: higher = more often wrong / less reliably remembered -> surfaced sooner in a queue */
function weakness(c){
  const lapses=Math.min(c.lapses||0,12),miss=Math.min(c.miss||0,12);
  const easeGap=Math.max(0,2.5-(c.ease||2.5));
  const reps=c.reps||0,okRatio=reps?((c.ok||0)/reps):0.7;
  if(c.fd>=1&&c.fs>0){const R=retrievability(c)||1;return lapses*3+miss*2+(c.fd-5)*2+(1-okRatio)*10+(1-R)*25;}
  return lapses*3+miss*2+easeGap*8+(1-okRatio)*10;
}

function deckCounts(did){

  const seen=new Set();
  for(const c of S.cards){if(c.deckId!==did)continue;if(cardExcluded(c))continue;const k=grpKey(c);if(k){if(seen.has(k))continue;seen.add(k);}total++;if(c.type==='new')n++;else if(c.type==='review'){if(c.due<eod)r++;}else if(c.due<eod)l++;}
  return {new:Math.min(n,newLeft(deckById(did))),newAll:n,learn:l,review:r,total:total};
}
function statAdd(did,ok,delta){
  let st=S.stats[did];if(!st)st=S.stats[did]={id:did,days:{}};if(!st.days)st.days={};
  const k=dayKey();const e=st.days[k]||(st.days[k]={n:0,ok:0});
  e.n=Math.max(0,e.n+delta);if(ok)e.ok=Math.max(0,e.ok+delta);
  const keys=Object.keys(st.days).sort();if(keys.length>400)keys.slice(0,keys.length-400).forEach(x=>delete st.days[x]);

function dayStats(ids){

  const now=Date.now();let min=Infinity;
  for(const x of cardsOfDeck(did)){if(cardExcluded(x))continue;if(x.type!=='new'&&x.due<min)min=x.due;}
  if(min===Infinity)return 'Новые карточки появятся, когда вы добавите рамки.';
  if(min-now<86400000*1.5&&startOfDay(min)===startOfDay(now))return 'Следующая карточка через '+fmtDelay(min-now)+'.';
  const dd=Math.round((startOfDay(min)-startOfDay(now))/86400000);

function parsePairs(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n').map(l=>l.replace(/\u00a0/g,' ').replace(/[ ]+$/,'').replace(/^[ ]+/,''));
  const ne=lines.filter(l=>l.trim());if(!ne.length)return {pairs:[],odd:false,how:''};
  const tidy=t=>String(t).replace(/\t+/g,' ').replace(/\s+/g,' ').trim();
  if(ne.filter(l=>l.indexOf('\t')>0).length>=ne.length*0.6){
    return {how:'tab',odd:false,pairs:ne.map(l=>{const i=l.indexOf('\t');return i>0?[tidy(l.slice(0,i)),tidy(l.slice(i+1))]:null;}).filter(p=>p&&p[0]&&p[1])};
  }
  const dre=/\s[—–=]\s|\s-\s/;
  if(ne.filter(l=>dre.test(l)).length>=ne.length*0.6){
    return {how:'dash',odd:false,pairs:ne.map(l=>{const m=l.match(dre);if(!m)return null;return [tidy(l.slice(0,m.index)),tidy(l.slice(m.index+m[0].length))];}).filter(p=>p&&p[0]&&p[1])};
  }
  const blocks=[];let cur=[];lines.forEach(l=>{if(l.trim())cur.push(l.trim());else if(cur.length){blocks.push(cur);cur=[];}});if(cur.length)blocks.push(cur);
  if(blocks.length>1&&blocks.filter(b=>b.length>=2).length>=blocks.length*0.6){
    return {how:'blocks',odd:blocks.some(b=>b.length<2),pairs:blocks.filter(b=>b.length>=2).map(b=>[tidy(b[0]),tidy(b.slice(1).join(' '))])};
  }
  const pairs=[];for(let i=0;i+1<ne.length;i+=2)pairs.push([tidy(ne[i]),tidy(ne[i+1])]);
  return {how:'lines',odd:ne.length%2===1,pairs:pairs};
}

async function tEdit(did,nid,after){
  const d=deckById(did);if(!d)return;
  const cards=nid?S.cards.filter(c=>isText(c)&&(c.noteId||c.id)===nid):[];
  if(nid&&!cards.length)return;
  const f0=cards.find(c=>c.dir!=='r')||cards[0];
  let dr={front:f0?f0.front:'',back:f0?f0.back:'',both:nid?cards.some(c=>c.dir==='r'):true,ref:f0&&f0.refPlateId&&plateById(f0.refPlateId)?f0.refPlateId:null};
  while(true){
    const u=dr.ref?plateUrl(plateById(dr.ref)):'';
    const html='<div class="dlg"><h3>'+(nid?'Карточка':'Новая карточка')+'</h3>'+
      '<label class="fl" for="nF">Термин</label><textarea id="nF" rows="2" placeholder="lig. transversum atlantis">'+esc(dr.front)+'</textarea>'+
      '<label class="fl" for="nB">Описание</label><textarea id="nB" rows="3" placeholder="между massae laterales atlantis; удерживает dens">'+esc(dr.back)+'</textarea>'+
      '<label class="chk"><input type="checkbox" id="nBoth"'+(dr.both?' checked':'')+'> В обе стороны</label>'+
      '<div class="nref">'+(dr.ref?(u?'<img src="'+esc(u)+'" alt="" data-fb>':'')+'<span class="nref-t">'+esc(refLabel(dr.ref))+'</span><button class="btn line sm" id="nLink">Другое фото</button><button class="btn quiet sm" id="nUnlink">Убрать</button>':'<button class="btn line sm" id="nLink">'+ic('link',16)+'Связать с фото</button><span class="nref-t muted">необязательно — фото покажется вместе с ответом</span>')+'</div>'+
      '<div class="dlg-btns">'+(nid?'<button class="btn line danger ico" id="nDel" aria-label="Удалить карточку">'+ic('trash',18)+'</button>':'')+'<button class="btn line" data-s="0">Отмена</button><button class="btn primary" id="nSave">Сохранить</button></div></div>';
    const v=await showOverlay(html,ov=>{
      mountImgFallbacks();
      const grab=()=>{dr.front=$('#nF',ov).value.trim();dr.back=$('#nB',ov).value.trim();dr.both=$('#nBoth',ov).checked;};
      if(!nid)setTimeout(()=>{const i=$('#nF',ov);if(i)i.focus();},60);
      $('#nLink',ov).onclick=()=>{grab();dismissOverlay('link');};
      const un=$('#nUnlink',ov);if(un)un.onclick=()=>{grab();dr.ref=null;dismissOverlay('again');};
      const del=$('#nDel',ov);if(del)del.onclick=()=>dismissOverlay('del');
      $('#nSave',ov).onclick=()=>{grab();if(!dr.front||!dr.back){toast('Заполните термин и описание');return;}dismissOverlay('save');};
      $$('[data-s]',ov).forEach(b=>b.onclick=()=>dismissOverlay(null));
    });
    if(v==='again')continue;
    if(v==='link'){const pid=await pickRefPlate(did);if(pid)dr.ref=pid;continue;}
    if(v==='del'){
      if(await confirmDialog({title:'Удалить карточку?',text:'«'+(f0?f0.front:'')+'» удалится вместе с прогрессом'+(cards.length>1?' (обе стороны)':'')+'.'})){cards.forEach(c=>removeCard(c.id));toast('Карточка удалена');}
      break;
    }
    if(v==='save'){
      if(!nid){addNote(did,dr.front,dr.back,dr.both,dr.ref);toast('Карточка добавлена');}
      else{
        cards.forEach(c=>{if(c.fh!=null&&(c.front!==dr.front||c.back!==dr.back)){delete c.fh;delete c.bh;}c.front=dr.front;c.back=dr.back;if(dr.ref)c.refPlateId=dr.ref;else delete c.refPlateId;persist('terms',c.id);});
        const rev=cards.find(c=>c.dir==='r');
        if(dr.both&&!rev){const b=Object.assign({},{deckId:did,front:dr.front,back:dr.back,noteId:nid,dir:'r',createdAt:(f0.createdAt||Date.now())+0.5});if(dr.ref)b.refPlateId=dr.ref;mkTextCard(b);}
        else if(!dr.both&&rev&&cards.length>1)removeCard(rev.id);
      }
    }
    break;
  }
  if(after)after();else render();
}
function refHtml(c){
  const p=c.refPlateId&&plateById(c.refPlateId);if(!p)return '';const u=plateUrl(p);if(!u)return '';

  return '<div class="tref"><div class="tref-in"'+(ar?' style="aspect-ratio:'+p.w+'/'+p.h+';width:min(100%,calc(44vh * '+ar.toFixed(4)+'))"':'')+'><img src="'+esc(u)+'" alt="" data-fb>'+(box&&isArrow(box)?arrowSvg([{c:box,cls:'open'}],plateAspect(p),1000/Math.max(200,Math.min(innerWidth-72,560))):box?'<div class="tref-box" style="'+geo(box)+'"></div>':'')+'</div><div class="tref-cap">'+esc(refLabel(p.id))+'</div></div>';

function uploadErrText(e){

  if(c==='rate_limited')return 'Слишком много загрузок подряд — попробуйте через минуту.';
  if(c==='unsupported_type')return 'Этот формат не поддерживается — выберите JPG или PNG.';

async function createPlate(deckId,blob,w,h){

  else{local=true;url=URL.createObjectURL(blob);}
  const p={id:newId('plates'),deckId:deckId,assetId:assetId,w:w,h:h,createdAt:Date.now()};
  if(local){p._local=true;p._url=url;}
  S.plates.push(p);persist('plates',p.id);return p;
}

function startSession(scope,cram,subset,mode){
  const deckIds=scope.deckIds;

function distractors(c){

    }

    for(const o of shuffle(pool.slice())){if(!o.term)continue;const k=norm(o.term);if(!k||seen.has(k))continue;seen.add(k);out.push(o.term);if(out.length>=3)return out;}

      else if(shown)c.hintLeft=Math.max(0,c.hintLeft-1);
      persist('terms',c.id);syncGrp(c);statAdd(c.deckId,r>1,1);
      if(r===1&&!c.hint&&c.miss>=hintAfter()&&c.miss>=(c.hintSnooze||0)){
        SS.done++;SS.lastId=c.id;askHint(c).then(()=>nextCard()).catch(e=>recoverFromError(tagErr('askHint',e)));return;

function nearestUnnamed(fromId){
  const c0=cardById(fromId);if(!c0)return null;
  const q0=cardPt(c0),cx=q0.x,cy=q0.y;let best=null,bd=Infinity;
  cardsOfPlate(c0.plateId).forEach(c=>{
    if(c.id===fromId||c.term)return;
    const q=cardPt(c),dx=q.x-cx,dy=q.y-cy,d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=c;}
  });
  return best;
}

    if(ED.sel===id)edReadUi(true);
    const g={x:c.x,y:c.y,w:c.w,h:c.h};
    t=(await ocrOne(w,img,g,ED.lh,20)).replace(/-+$/,'');
    if(!t&&live())t=(await ocrOne(w,img,g,ED.lh,25,true)).replace(/-+$/,'');
  }catch(e){console.warn('auto-read',e);failed=true;}
  finally{if(live())edReading(id,false);}
  if(!live())return;
  const cc=cardById(id);if(!cc||geoKey(cc)!==key)return;
  if(failed){if(why!=='sel'&&!ED.arFailNoted){ED.arFailNoted=1;toast('Распознавание текста не запустилось в этом окне — впишите название вручную.');}return;}
  if(!t){if(why==='add'&&!cc.term)toast('Текст в рамке не прочитался — впишите название вручную.',2800);return;}
  const cur=cc.term;
  if(cur!==before||cur===t)return;
  if(cur&&latKey(cur)===latKey(t))return;
  if(!cur||cur===OCR_AUTO.get(id)||(latKey(cur).length>=2&&latKey(t).indexOf(latKey(cur))>=0)){
    const u=ED.undo[ED.undo.length-1];
    if(u&&u.t==='geom'&&u.id===id){u.term0=cur;u.termAuto=t;}
    else if(!(u&&u.t==='add'&&u.id===id))ED.undo.push({t:'term',id:id,term:cur,auto:t});
    cc.term=t;OCR_AUTO.set(id,t);persist('terms',id);noteLatFix(id,t);edShowTerm(cc);
  }else{
    /* the frame already has a name the user typed: offer the new reading instead of overwriting it */
    ED.sugg={id:id,t:t};if(ED.sel===id){const g=$('#ocrSugg');if(g)g.innerHTML=suggHtml(cc);}
  }
}
function edSugg(){
  const g=ED&&ED.sugg;const c=g&&cardById(g.id);if(!c)return;flushTerm();
  ED.undo.push({t:'term',id:c.id,term:c.term,auto:g.t});c.term=g.t;OCR_AUTO.set(c.id,g.t);ED.sugg=null;persist('terms',c.id);updEd();

function loadImage(src){return new Promise((res,rej)=>{const im=new Image();if(window.CORPUS_WEB&&!/^(?:blob|data):/.test(src))im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
function toCanvas(img,max){let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);return c;}
function rotateCanvas(src){const c=document.createElement('canvas');c.width=src.height;c.height=src.width;const x=c.getContext('2d');x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(src,0,0);return c;}

  },

function layoutCrop(){
  const vp=$('#cropvp'),box=$('#cropbox');if(!vp||!box||!CR)return;
  const W=vp.clientWidth-48,H=vp.clientHeight-48;const a=CR.canvas.height/CR.canvas.width;const w=Math.max(60,Math.min(W,H/a));
  box.style.width=w+'px';box.style.height=(w*a)+'px';placeCrect();
}
function placeCrect(){const e=$('#crect');if(!e)return;const r=CR.rect;e.style.left=r.x+'%';e.style.top=r.y+'%';e.style.width=r.w+'%';e.style.height=r.h+'%';}
function bindCrop(){
  const box=$('#cropbox'),cr=$('#crect');let d=null;const MN=5;
  const pt=e=>{const r=box.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100};};
  cr.addEventListener('pointerdown',e=>{e.preventDefault();d={h:e.target.dataset.h||'move',p0:pt(e),r0:Object.assign({},CR.rect)};try{cr.setPointerCapture(e.pointerId);}catch(_){}});
  cr.addEventListener('pointermove',e=>{
    if(!d)return;const p=pt(e),dx=p.x-d.p0.x,dy=p.y-d.p0.y,o=d.r0;let x=o.x,y=o.y,w=o.w,h=o.h;
    if(d.h==='move'){x=clamp(o.x+dx,0,100-o.w);y=clamp(o.y+dy,0,100-o.h);}
    else{
      if(d.h==='tl'||d.h==='bl'){x=clamp(o.x+dx,0,o.x+o.w-MN);w=o.x+o.w-x;}else w=clamp(o.w+dx,MN,100-o.x);
      if(d.h==='tl'||d.h==='tr'){y=clamp(o.y+dy,0,o.y+o.h-MN);h=o.y+o.h-y;}else h=clamp(o.h+dy,MN,100-o.y);
    }
    CR.rect={x:x,y:y,w:w,h:h};placeCrect();
  });
  const up=()=>{d=null;};cr.addEventListener('pointerup',up);cr.addEventListener('pointercancel',up);
}
function cropRotate(){const old=CR.canvas;CR.canvas=rotateCanvas(old);CR.rot=(CR.rot+1)%4;CR.rect=rotRect(CR.rect);old.replaceWith(CR.canvas);layoutCrop();}
function cropCancel(){const c=CR;CR=null;if(c.mode==='edit')openEditor(c.plateId);else go({name:'deck',deckId:c.deckId,tab:'photos'});}
async function cropApply(){
  const cv=CR.canvas,rc=CR.rect;const full=rc.x<0.01&&rc.y<0.01&&rc.w>99.99&&rc.h>99.99;
  if(CR.mode==='edit'&&full&&CR.rot===0){cropCancel();return;}
  const sx=Math.round(rc.x/100*cv.width),sy=Math.round(rc.y/100*cv.height),sw=Math.max(1,Math.round(rc.w/100*cv.width)),sh=Math.max(1,Math.round(rc.h/100*cv.height));
  const out=document.createElement('canvas');out.width=sw;out.height=sh;out.getContext('2d').drawImage(cv,sx,sy,sw,sh,0,0,sw,sh);
  if(CR.mode==='edit'){
    const tf=r=>{let g={x:r.x,y:r.y,w:r.w,h:r.h};for(let i=0;i<CR.rot;i++)g=rotRect(g);return cropRectTo(g,rc);};
    const tfp=(x,y)=>{let g={x:x,y:y,w:0,h:0};for(let i=0;i<CR.rot;i++)g=rotRect(g);return {x:(g.x-rc.x)/rc.w*100,y:(g.y-rc.y)/rc.h*100};};
    const inb=q=>q.x>=0&&q.x<=100&&q.y>=0&&q.y<=100;
    const moved=cardsOfPlate(CR.plateId).map(c=>isArrow(c)?{c:c,arr:{a:tfp(c.ax,c.ay),b:tfp(c.bx,c.by)}}:{c:c,g:tf(c),ex:Array.isArray(c.extra)?c.extra.map(tf):null});
    moved.forEach(t=>{if(t.arr)t.lost=!inb(t.arr.a);else t.lost=t.g.w<0.8||t.g.h<0.5;});
    const lost=moved.filter(t=>t.lost).length;
    if(lost&&!(await confirmDialog({title:'Часть рамок окажется за краем',text:pl(lost,'рамка будет удалена','рамки будут удалены','рамок будут удалены')+' вместе с прогрессом.',ok:'Обрезать'})))return;
    CR._moved=moved;
  }
  busy('Сохраняю фото…');
  let blob=await new Promise(r=>out.toBlob(r,'image/jpeg',0.86));
  if(blob&&blob.size>18*1024*1024)blob=await new Promise(r=>out.toBlob(r,'image/jpeg',0.9));
  if(!blob){hideBusy();toast('Не удалось обработать изображение.');return;}
  if(CR.mode==='new'){const p=await createPlate(CR.deckId,blob,sw,sh);hideBusy();if(p){CR=null;openEditor(p.id);}return;}
  const p=plateById(CR.plateId);if(!p){hideBusy();return;}
  let assetId=null;
  if(S.assets&&!p._local){try{assetId=(await S.assets.upload(blob)).id;}catch(e){hideBusy();toast(uploadErrText(e));return;}}
  const old=p.assetId;
  CR._moved.forEach(t=>{if(t.lost)removeCard(t.c.id);else if(t.arr){setArrow(t.c,t.arr.a.x,t.arr.a.y,t.arr.b.x,t.arr.b.y);persist('terms',t.c.id);}else{Object.assign(t.c,{x:r2(t.g.x),y:r2(t.g.y),w:r2(t.g.w),h:r2(t.g.h)});if(t.ex)t.c.extra=t.ex.filter(g=>g.w>=0.8&&g.h>=0.5).map(g=>({x:r2(g.x),y:r2(g.y),w:r2(g.w),h:r2(g.h)}));persist('terms',t.c.id);}});
  if(assetId)p.assetId=assetId;else{p._url=URL.createObjectURL(blob);}
  p.w=sw;p.h=sh;persist('plates',p.id);
  if(old&&assetId&&S.assets)afterWrites(()=>S.assets.delete(old).catch(()=>{}));
  hideBusy();const pid=p.id;CR=null;openEditor(pid);
}


/* ---------- backup, export, import ---------- */
const META={id:'settings',lastBackup:0};
const WEEK=7*86400000;
function persistMeta(){if(S.db)enq('meta/settings',{coll:'meta',id:'settings',op:'set'});}
function setBusy(t){const b=$('#busy .busy-in div:nth-child(2)');if(b)b.textContent=t;}
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}
function dataURLtoBlob(u){const i=u.indexOf(',');const mime=(u.slice(5,i).split(';')[0])||'image/jpeg';const bin=atob(u.slice(i+1));const a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:mime});}
const CONTENT_KEYS=['deckId','plateId','term','x','y','w','h','extra','shape','ax','ay','bx','by','hint','createdAt','grp'];
const TEXT_KEYS=['deckId','kind','front','back','dir','noteId','refPlateId','hint','createdAt'];
function safeName(s){return String(s||'deck').replace(/[\\/:*?"<>|\s]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'deck';}
function backupAgeText(){if(!META.lastBackup)return 'Копий ещё не было';const d=Math.floor((Date.now()-META.lastBackup)/86400000);return 'Последняя копия: '+(d<1?'сегодня':d===1?'вчера':pl(d,'день','дня','дней')+' назад');}
/* link: for sharing by code — plates carry the photo's storage id (`asset`) instead of the picture itself */
async function buildExport(deckIds,full,fid,link){
  const out={app:'corpus',kind:full?'backup':'deck',version:1,exportedAt:new Date().toISOString(),decks:[],plates:[],cards:[],stats:{},folders:[]};
  const sf=!full&&fid?folderById(fid):null;
  if(sf){out.kind='folder';out.folders.push({id:sf.id,name:sf.name,mode:sf.mode||'hideAll'});}
  const dl=deckIds.map(deckById).filter(Boolean);
  const ps=[];dl.forEach(d=>platesOf(d.id).forEach(p=>ps.push(p)));let i=0,miss=0;
  for(const d of dl){
    out.decks.push(full?Object.assign({id:d.id},clean(d)):Object.assign({id:d.id,name:d.name,newPerDay:d.newPerDay==null?20:d.newPerDay,mode:d.mode||'hideAll',createdAt:d.createdAt||0},d.kind?{kind:d.kind}:{},sf?{folderId:sf.id}:{}));
    if(full&&S.stats[d.id])out.stats[d.id]={days:S.stats[d.id].days||{}};
  }
  if(full){
    const fids=new Set(S.decks.filter(d=>deckIds.indexOf(d.id)>=0).map(d=>d.folderId).filter(Boolean));
    S.folders.filter(f=>fids.has(f.id)).forEach(f=>out.folders.push(Object.assign({id:f.id},clean(f))));
  }
  for(const p of ps){
    i++;const po={id:p.id,deckId:p.deckId,w:p.w||0,h:p.h||0,createdAt:p.createdAt||0};
    if(link){if(!p.assetId){miss++;continue;}po.asset=p.assetId;}
    else{
      setBusy('Готовлю файл… фото '+i+' из '+ps.length);
      let img=null;const u=plateUrl(p);if(u){try{img=await blobToDataURL(await (await fetch(u)).blob());}catch(e){}}
      if(!img){miss++;continue;}
      po.image=img;
    }
    if(full&&p.excluded)po.excluded=true;
    out.plates.push(po);
    for(const c of cardsOfPlate(p.id)){
      if(full)out.cards.push(Object.assign({id:c.id},clean(c)));
      else{const o={id:c.id};CONTENT_KEYS.forEach(k=>{if(c[k]!=null)o[k]=c[k];});out.cards.push(o);}
    }
  }
  for(const c of S.cards){
    if(!isText(c)||deckIds.indexOf(c.deckId)<0)continue;
    if(full)out.cards.push(Object.assign({id:c.id},clean(c)));
    else{const o={id:c.id};TEXT_KEYS.forEach(k=>{if(c[k]!=null)o[k]=c[k];});out.cards.push(o);}
  }
  return {out:out,miss:miss};
}
async function saveExport(deckIds,full,filename,fid){
  if(!S.downloads){toast('Сохранение файлов недоступно в этом окне.');return false;}
  busy('Готовлю файл…');let res;
  try{res=await buildExport(deckIds,full,fid);}catch(e){hideBusy();toast('Не удалось подготовить файл.');return false;}
  hideBusy();
  try{
    await S.downloads.save({filename:filename,data:new Blob([JSON.stringify(res.out)],{type:'application/json'})});
    if(res.miss)toast('Файл сохранён, но '+pl(res.miss,'фото не удалось','фото не удалось','фото не удалось')+' прочитать.');
    return true;
  }catch(e){
    const c=e&&e.code;if(c==='declined')return false;
    toast(c==='rate_limited'?'Подождите немного и попробуйте снова.':'Не удалось сохранить файл.');return false;
  }
}

async function importFile(file){

/* data: an export file, or a share received by code (opts.from — who shared it) */
async function importData(data,opts){
  opts=opts||{};
  if(!S.assets&&data.plates.length){toast('В этом окне нельзя загружать фото — откройте приложение по своей ссылке.');return;}
  const full=data.kind==='backup'&&!opts.share;const nc=(data.cards||[]).length;
  const who=opts.from?' Отправитель: '+opts.from+'.':'';
  const isFolder=!full&&data.kind==='folder'&&Array.isArray(data.folders)&&!!data.folders[0];
  let replace=false;
  if(full){
    const when=data.exportedAt?new Date(data.exportedAt):null;
    const v=await actionSheet('Копия'+(when?' от '+when.getDate()+' '+MONTHS[when.getMonth()]:'')+': '+pl(data.decks.length,'колода','колоды','колод')+', '+pl(nc,'карточка','карточки','карточек'),[
      {v:'replace',icon:'rotate',label:'Заменить всё текущее',sub:'Как было на момент копии',danger:true},
      {v:'add',icon:'plus',label:'Добавить к текущим колодам'}]);
    if(!v)return;replace=v==='replace';
    if(replace&&S.decks.length&&!(await confirmDialog({title:'Заменить все данные?',text:'Текущие колоды, фото и прогресс будут удалены и заменены содержимым копии.',ok:'Заменить'})))return;
  }else if(isFolder){
    if(!(await confirmDialog({title:'Импортировать папку?',text:'«'+String(data.folders[0].name||'Папка')+'»: '+pl(data.decks.length,'колода','колоды','колод')+', '+pl(data.plates.length,'фото','фото','фото')+', '+pl(nc,'карточка','карточки','карточек')+'. Прогресс начнётся с нуля.'+who,ok:'Импортировать',danger:false})))return;
  }else{
    if(!(await confirmDialog({title:'Импортировать колоду?',text:(data.decks[0]?'«'+data.decks[0].name+'»: ':'')+pl(data.plates.length,'фото','фото','фото')+', '+pl(nc,'карточка','карточки','карточек')+'. Прогресс начнётся с нуля.'+who,ok:'Импортировать',danger:false})))return;
  }
  busy('Загружаю фото…');
  const pmap={},uploaded=[];let missP=0;
  /* the picture itself (a file) or a copy of the sharer's photo from storage (a share) */
  const srcBlob=async p=>{
    if(typeof p.image==='string'&&p.image.indexOf('data:')===0)return dataURLtoBlob(p.image);
    if(typeof p.asset==='string'&&/^[A-Za-z0-9_-]{6,80}$/.test(p.asset)){const r=await fetch(blobUrl(p.asset));if(!r.ok)throw {code:'missing'};return await r.blob();}
    return null;
  };
  try{
    if(data.plates.length)setBusy('Загружаю фото 1 из '+data.plates.length+'…');
    await parallel(data.plates,AK_PAR,async p=>{
      if(!p)return;let b;
      try{b=await srcBlob(p);}catch(e){if(e&&e.code==='missing'){missP++;return;}throw e;}
      if(!b)return;
      const r=await akUpload(b);uploaded.push(r.id);pmap[p.id]={assetId:r.id,src:p};
    },(d,n)=>{if(d<n)setBusy('Загружаю фото '+(d+1)+' из '+n+'…');});
  }catch(e){hideBusy();uploaded.forEach(a=>S.assets.delete(a).catch(()=>{}));toast(uploadErrText(e)+' Импорт отменён.');return;}
  if(replace)wipeAll();
  const fmap={};let newFid=null;
  if(isFolder){
    const sf=data.folders[0];let fname=String(sf.name||'Папка');if(S.folders.some(x=>x.name===fname))fname+=' (импорт)';
    const f={id:newId('folders'),name:fname,mode:sf.mode||'hideAll',createdAt:Date.now()};
    newFid=f.id;fmap[sf.id]=f.id;S.folders.push(f);persist('folders',f.id);
  }
  const t0=Date.now();
  const inOrder=(arr,key)=>(arr||[]).map((o,k)=>({o:o,k:k,t:+(o&&o[key])||0})).sort((a,b)=>(a.t-b.t)||(a.k-b.k));
  if(full&&Array.isArray(data.folders)){
    data.folders.forEach((sf,k)=>{
      const f=Object.assign({},sf);f.id=newId('folders');f.createdAt=sf.createdAt||(t0+k);
      fmap[sf.id]=f.id;S.folders.push(f);persist('folders',f.id);
    });
  }
  const dmap={};const taken=new Set(S.decks.map(d=>d.name));
  inOrder(data.decks,'createdAt').map(x=>x.o).forEach((sd,k)=>{
    let name=String(sd.name||'Колода');if(!replace&&!isFolder&&taken.has(name))name+=' (импорт)';
    const d=full?Object.assign({},sd):{name:name,newPerDay:sd.newPerDay==null?20:sd.newPerDay,mode:sd.mode||'hideAll'};if(!full&&sd.kind==='text')d.kind='text';
    d.name=name;d.id=newId('decks');d.createdAt=(full&&sd.createdAt)?sd.createdAt:t0+k;if(!full)delete d.newToday;
    if(full&&d.folderId)d.folderId=fmap[d.folderId]||null;if(isFolder)d.folderId=fmap[sd.folderId]||newFid;if(d.folderId==null)delete d.folderId;
    dmap[sd.id]=d.id;S.decks.push(d);persist('decks',d.id);
    if(full&&data.stats&&data.stats[sd.id]){S.stats[d.id]={id:d.id,days:data.stats[sd.id].days||{}};persist('stats',d.id);}
  });
  const lastT={};const nextT=(did,t)=>(lastT[did]=Math.max(t||t0,(lastT[did]||0)+1));
  inOrder(Object.keys(pmap).map(oid=>pmap[oid].src),'createdAt').forEach(x=>{
    const sp=x.o,m=pmap[sp.id];if(!dmap[sp.deckId])return;
    const p={id:newId('plates'),deckId:dmap[sp.deckId],assetId:m.assetId,w:sp.w||0,h:sp.h||0,createdAt:nextT('p'+dmap[sp.deckId],x.t)};
    if(full&&sp.excluded)p.excluded=true;
    m.nid=p.id;S.plates.push(p);persist('plates',p.id);
  });
  let n=0;
  const nmap={},restored=[];
  inOrder(data.cards,'createdAt').map(x=>x.o).forEach(sc=>{
    if(sc&&sc.kind==='text'){
      if(!dmap[sc.deckId]||!sc.front||!sc.back)return;
      const base={};TEXT_KEYS.forEach(k=>{if(sc[k]!=null)base[k]=sc[k];});
      const c=full?Object.assign({},sc,base):Object.assign(base,{type:'new'});
      c.id=newId('terms');c.deckId=dmap[sc.deckId];const ok=sc.noteId||sc.id;c.noteId=nmap[ok]||(nmap[ok]=newId('terms'));
      const rp=sc.refPlateId&&pmap[sc.refPlateId]&&pmap[sc.refPlateId].nid;if(rp)c.refPlateId=rp;else delete c.refPlateId;
      c.createdAt=nextT('n'+c.deckId,+sc.createdAt||0);   // notes keep their order even when the source had equal times
      delete c.plateId;delete c._pk;restored.push(normCard(c));n++;return;
    }
    const m=pmap[sc.plateId];if(!m||!m.nid||!dmap[sc.deckId])return;
    const base={};CONTENT_KEYS.forEach(k=>{if(sc[k]!=null)base[k]=sc[k];});
    const c=full?Object.assign({},sc,base):Object.assign(base,{type:'new'});
    c.id=newId('terms');c.deckId=dmap[sc.deckId];c.plateId=m.nid;delete c._pk;
    restored.push(normCard(c));n++;
  });
  packAdd(restored);
  hideBusy();
  toast(full?'Восстановлено: '+pl(n,'карточка','карточки','карточек'):isFolder?'Папка импортирована: '+pl(n,'карточка','карточки','карточек'):'Колода импортирована: '+pl(n,'карточка','карточки','карточек'));
  if(missP)setTimeout(()=>toast('Не удалось загрузить фото: '+missP+'.',5000),3200);
  go(isFolder&&newFid?{name:'folder',folderId:newFid}:{name:'library'});
}

/* ---------- sharing by code / QR (the website): a snapshot of the deck goes to the site's database under a

function sharesApi(){const W=window.CORPUS_WEB;return W&&W.shares?W.shares:null;}
function shareCodeText(c){return String(c||'').replace(/(.{5})(?=.)/g,'$1 ');}
async function qrSvg(text){
  if(!window.qrcode)await loadScript(window.CORPUS_WEB.qrScript);
  const q=window.qrcode(0,'M');q.addData(text);q.make();
  return q.createSvgTag({cellSize:4,margin:0,scalable:true});

async function shareByCode(kind,id){

  let svg='';try{svg=await qrSvg(sh.url);}catch(e){}

    '<p>'+(kind==='folder'?'Папка целиком: ':'')+esc(pl(np,'фото','фото','фото')+', '+pl(n,'карточка','карточки','карточек'))+'. Без прогресса.'+(res.miss?' Без файла: '+res.miss+'.':'')+'</p>'+
    (svg?'<div class="qr" role="img" aria-label="QR-код">'+svg+'</div>':'')+
    '<div class="share-code" id="shareCode" data-code="'+esc(sh.code)+'" data-noi18n>'+esc(shareCodeText(sh.code))+'</div>'+
    '<p class="muted sm">Другой человек наводит камеру телефона на код или вводит буквы в Corpus: Ещё → Получить по коду. Код действует, пока вы его не отзовёте. Откройте это окно снова, чтобы передать свежую версию колоды.</p>'+
    '<div class="dlg-btns"><button class="btn line" data-s="revoke">Отозвать</button><button class="btn line" data-s="send">Отправить ссылку</button><button class="btn primary" data-s="ok">Готово</button></div></div>';
  const send=()=>{   /* inside the tap: the share sheet needs a fresh user gesture */
    const title=obj.name+' — Corpus';
    if(navigator.share){navigator.share({title:title,text:title,url:sh.url}).catch(()=>{});return;}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(sh.url).then(()=>toast('Ссылка скопирована'),()=>toast(sh.url,6000));return;}
    toast(sh.url,6000);
  };
  const v=await showOverlay(html,ov=>{$$('[data-s]',ov).forEach(b=>b.onclick=()=>{if(b.dataset.s==='send')send();else dismissOverlay(b.dataset.s);});});
  if(v==='revoke'){
    if(await confirmDialog({title:'Отозвать код?',text:'Ссылка и QR-код перестанут работать. У тех, кто уже импортировал колоду, она останется.',ok:'Отозвать'})){
      try{await api.drop(src);toast('Код отозван');}catch(e){toast('Не удалось отозвать код. Проверьте соединение.');}
    }
  }
}
async function openShareCode(code){
  const api=sharesApi();if(!api)return;

/* ---------- check a deck against your notes: cards missing from the list can be removed together with their frames ---------- */
const CMP_ABBR={m:'musculus',mm:'musculi',a:'arteria',aa:'arteriae',n:'nervus',nn:'nervi',v:'vena',vv:'venae',lig:'ligamentum',ligg:'ligamenta',proc:'processus',for:'foramen',tub:'tuberculum',r:'ramus',rr:'rami',art:'articulatio',artt:'articulationes',gl:'glandula',gll:'glandulae',sut:'sutura',inc:'incisura',fiss:'fissura',tr:'tractus',nucl:'nucleus',lam:'lamina',marg:'margo',fac:'facies'};
function cmpKey(s){
  let t=String(s||'').toLowerCase().replace(/\([^)]*\)|\[[^\]]*\]/g,' ');
  t=t.replace(/(^|[^a-zа-яё])([a-z]{1,5})\.(?=\s|$)/g,(m0,pre,ab)=>pre+(CMP_ABBR[ab]||ab)+' ');
  return norm(t);
}
function cmpParse(text){
  const raw=String(text||'').replace(/\r/g,'').replace(/ /g,' ');
  let lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const out=[];const seen=new Set();
  const few=lines.length<=2&&/[,;].*[,;]/.test(raw);
  lines.forEach(l=>{
    l=l.replace(/^(?:[-–—•*·▪●◦+]+|\(?\d{1,3}[.)]|[a-zа-я][.)])\s+/i,'');
    const cut=l.search(/\t| [—–-] |: /);if(cut>0)l=l.slice(0,cut);
    l.split(few?/[;,]/:/;/).forEach(x=>{x=x.replace(/^[\s"«“„]+|[\s"»”.,:]+$/g,'');const k=cmpKey(x);if(!k||!/[a-zа-яё]/.test(k)||seen.has(k))return;seen.add(k);out.push({text:x,key:k});});
  });
  return out;
}
function cmpSim(a,b){
  if(a===b)return 2;if(!a||!b)return 0;
  const L=Math.max(a.length,b.length);if(Math.abs(a.length-b.length)<=Math.max(1,Math.round(L*0.15))&&lev(a,b)<=Math.max(1,Math.round(L*0.15)))return 1;
  const wa=a.split(' '),wb=b.split(' ');const s=wa.length<=wb.length?wa:wb,l=s===wa?wb:wa;
  if(s.length>=2&&s.every(w=>l.some(x=>x===w||(w.length>4&&x.length>4&&lev(w,x)<=1))))return 1;
  return 0;
}
/* the deck's entries: one per name (a label on several photos counts once), plus frames without a name */
function cmpEntries(did){
  const d=deckById(did);const ps=platesOf(did);const idx={};ps.forEach((p,i)=>idx[p.id]=i+1);
  const map=new Map(),unnamed=[];
  if(isTextDeck(d)){
    notesOfDeck(did).forEach(n=>{const t=n.f.front;const k=cmpKey(t);if(!k){unnamed.push(...n.cards);return;}let e=map.get(k);if(!e){e={key:k,term:t,cards:[],where:[]};map.set(k,e);}e.cards.push(...n.cards);});
  }else{
    cardsOfDeck(did).forEach(c=>{if(!c.term){if(!isArrow(c))unnamed.push(c);return;}const k=cmpKey(c.term);let e=map.get(k);if(!e){e={key:k,term:c.term,cards:[],where:[]};map.set(k,e);}e.cards.push(c);const w=idx[c.plateId];if(w&&e.where.indexOf(w)<0)e.where.push(w);});
  }
  return {entries:Array.from(map.values()),unnamed:unnamed,text:isTextDeck(d)};
}
function cmpRun(did,items){
  const E=cmpEntries(did);const byKey=new Map(items.map(it=>[it.key,it]));const used=new Set();
  const exact=[],fuzzy=[],extra=[];
  E.entries.forEach(e=>{const it=byKey.get(e.key);if(it){exact.push(e);used.add(it.key);}});
  E.entries.forEach(e=>{if(byKey.has(e.key))return;let best=null;
    for(const it of items){if(cmpSim(e.key,it.key)){const dd=lev(e.key,it.key);if(!best||dd<best.d)best={it:it,d:dd};}}
    if(best){fuzzy.push({e:e,it:best.it});used.add(best.it.key);}else extra.push(e);});
  const missing=items.filter(it=>!used.has(it.key));
  return {did:did,text:E.text,exact:exact,fuzzy:fuzzy,extra:extra,unnamed:E.unnamed,missing:missing,ai:[]};
}
async function cmpNotes(did){

      (!R.extra.length&&!R.missing.length&&!R.fuzzy.length?'<p class="cmp-ok">Колода полностью совпадает с конспектом.</p>':'')+
      '</div>'+
      (canAI?'<button class="hintai" id="cmpAI">'+ic('spark',16)+'<span>Сопоставить по смыслу с Claude</span></button>':'')+
      '<div class="dlg-btns"><button class="btn line" data-s="0">'+(nDel||nFix?'Отмена':'Закрыть')+'</button>'+(nDel||nFix?'<button class="btn '+(nDel?'dangerfill':'primary')+'" id="cmpApply">'+(nDel?'Удалить ('+nDel+')':'Исправить ('+nFix+')')+'</button>':'')+'</div></div>';
    const v=await showOverlay(html,ov=>{

    if(tg==='details')text=text.slice(0,t0);

    if(!AK_TAGS.has(tg))return inner;

    if(tg==='font'){const col=n.getAttribute('color');if(col&&akColorOk('color',col))css=(css?css+';':'')+'color:'+col;tg='span';}
    if(tg==='center'){tg='div';css=(css?css+';':'')+'text-align:center';}

    if(tg==='td'||tg==='th'){['colspan','rowspan'].forEach(a=>{const v=n.getAttribute(a);if(v&&/^\d{1,2}$/.test(v))at+=' '+a+'="'+v+'"';});}

const AK_SHOW=new Map();

/* one Anki card of a text note type → question / answer html */
function akRenderCard(m,note,card,meta){
  const cz=m.type===1;const ti=cz?0:card.ord;const t=m.tmpls[ti];if(!t)return null;
  const f={};m.flds.forEach((nm,i)=>{f[nm]=note.f[i]||'';});
  const path=meta.decks[card.odid||card.did]||[];
  const base={f:f,tags:note.tags,type:m.name,deck:path.join('::'),subdeck:path[path.length-1]||'',card:t.name,cz:cz?card.ord+1:0};
  const qc=Object.assign({side:'q'},base);
  const q=akEval(akTpl(m.id+':'+ti+':q',t.q),qc);
  const FS='\u0001FS\u0001';const ac=Object.assign({side:'a',fs:FS},base);
  let a=akEval(akTpl(m.id+':'+ti+':a',t.a),ac);
  const k=a.lastIndexOf(FS);
  if(k>=0)a=a.slice(k+FS.length);else{const h=a.search(/<hr[^>]*id\s*=\s*["']?answer/i);if(h>=0)a=a.slice(h);}
  a=a.replace(/^(?:\s|<br\s*\/?>|<\/[a-z0-9]+\s*>|<hr[^>]*>)+/i,'');
  return {q:q,a:a,cz:qc.czAns||[],type:qc.typeAns!=null?qc.typeAns:ac.typeAns};
}

/* ---------- image occlusion geometry ---------- */
function akIOShapes(txt){
  const out=[];const re=/\{\{c(\d+)::image-occlusion:([^}]*)\}\}/g;let m;
  while((m=re.exec(String(txt||'').replace(/&nbsp;/g,' ')))){
    const parts=m[2].split(':');const kind=(parts.shift()||'').trim();const p={};
    parts.forEach(s=>{const i=s.indexOf('=');if(i>0)p[s.slice(0,i).trim()]=s.slice(i+1).trim();});
    if(kind==='text')continue;
    const num=k=>parseFloat(p[k]);let x,y,w,h;
    if(kind==='rect'){x=num('left');y=num('top');w=num('width');h=num('height');}
    else if(kind==='ellipse'){x=num('left');y=num('top');w=num('rx')*2;h=num('ry')*2;}
    else if(kind==='polygon'&&p.points){
      const pts=p.points.trim().split(/\s+/).map(s=>s.split(',').map(parseFloat)).filter(a=>a.length===2&&isFinite(a[0])&&isFinite(a[1]));if(!pts.length)continue;
      let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;pts.forEach(a=>{x0=Math.min(x0,a[0]);y0=Math.min(y0,a[1]);x1=Math.max(x1,a[0]);y1=Math.max(y1,a[1]);});
      const L=num('left'),T=num('top');let dx=0,dy=0;
      if(isFinite(L)&&x0<L*0.5&&Math.abs(x0-L)>Math.max(1e-3,L*0.05))dx=L-x0;if(isFinite(T)&&y0<T*0.5&&Math.abs(y0-T)>Math.max(1e-3,T*0.05))dy=T-y0;
      x=x0+dx;y=y0+dy;w=x1-x0;h=y1-y0;
    }else continue;
    if(![x,y,w,h].every(isFinite)||w<=0||h<=0)continue;
    out.push({n:+m[1],x:x,y:y,w:w,h:h,oi:p.oi==='1'});
  }
  return out;
}
function akPathBox(d){
  const t=String(d||'').match(/[a-zA-Z]|-?\d*\.?\d+(?:e-?\d+)?/g)||[];let i=0,cmd='',cx=0,cy=0,sx=0,sy=0;const xs=[],ys=[];
  const num=()=>parseFloat(t[i++]);const pt=(x,y)=>{xs.push(x);ys.push(y);};
  while(i<t.length){
    if(/[a-zA-Z]/.test(t[i]))cmd=t[i++];
    const rel=cmd===cmd.toLowerCase(),C=cmd.toUpperCase();
    if(C==='Z'){cx=sx;cy=sy;continue;}
    if(i>=t.length||/[a-zA-Z]/.test(t[i])){if(C!=='Z')i++;continue;}
    if(C==='M'||C==='L'||C==='T'){let x=num(),y=num();if(rel){x+=cx;y+=cy;}cx=x;cy=y;if(C==='M'){sx=x;sy=y;cmd=rel?'l':'L';}pt(x,y);}
    else if(C==='H'){let x=num();if(rel)x+=cx;cx=x;pt(cx,cy);}
    else if(C==='V'){let y=num();if(rel)y+=cy;cy=y;pt(cx,cy);}
    else if(C==='C'){for(let k=0;k<3;k++){let x=num(),y=num();if(rel){x+=cx;y+=cy;}pt(x,y);if(k===2){cx=x;cy=y;}}}
    else if(C==='S'||C==='Q'){for(let k=0;k<2;k++){let x=num(),y=num();if(rel){x+=cx;y+=cy;}pt(x,y);if(k===1){cx=x;cy=y;}}}
    else if(C==='A'){num();num();num();num();num();let x=num(),y=num();if(rel){x+=cx;y+=cy;}cx=x;cy=y;pt(x,y);}
    else i++;
  }
  if(!xs.length)return null;const x0=Math.min(...xs),y0=Math.min(...ys);return {x:x0,y:y0,w:Math.max(...xs)-x0,h:Math.max(...ys)-y0};
}
/* IOE masks: the shapes marked as the question (class qshape) in the card's Q mask */
function akIOESvg(svgText){
  const doc=new DOMParser().parseFromString(svgText,'image/svg+xml');const root=doc.documentElement;if(!root||root.nodeName.toLowerCase()!=='svg')return null;
  const vb=(root.getAttribute('viewBox')||'').split(/[\s,]+/).map(parseFloat);
  const W=parseFloat(root.getAttribute('width'))||(vb.length===4?vb[2]:0),H=parseFloat(root.getAttribute('height'))||(vb.length===4?vb[3]:0);
  const shapes=[];
  const box=el=>{const g=k=>parseFloat(el.getAttribute(k));const tg=el.nodeName.toLowerCase();
    if(tg==='rect')return {x:g('x')||0,y:g('y')||0,w:g('width'),h:g('height')};
    if(tg==='ellipse')return {x:g('cx')-g('rx'),y:g('cy')-g('ry'),w:2*g('rx'),h:2*g('ry')};
    if(tg==='circle')return {x:g('cx')-g('r'),y:g('cy')-g('r'),w:2*g('r'),h:2*g('r')};
    if(tg==='polygon'||tg==='polyline'){const n=(el.getAttribute('points')||'').trim().split(/[\s,]+/).map(parseFloat);const xs=[],ys=[];for(let i=0;i+1<n.length;i+=2){xs.push(n[i]);ys.push(n[i+1]);}if(!xs.length)return null;const x0=Math.min(...xs),y0=Math.min(...ys);return {x:x0,y:y0,w:Math.max(...xs)-x0,h:Math.max(...ys)-y0};}
    if(tg==='path')return akPathBox(el.getAttribute('d'));return null;};
  const visit=(el,q)=>{for(const c of Array.from(el.children)){const tg=c.nodeName.toLowerCase();const cls=(c.getAttribute('class')||'').split(/\s+/);const qq=q||cls.indexOf('qshape')>=0;
    if(tg==='g'){visit(c,qq);continue;}if(tg==='title'||tg==='text'||tg==='defs')continue;
    const b=box(c);if(!b||![b.x,b.y,b.w,b.h].every(isFinite)||b.w<=0||b.h<=0)continue;
    shapes.push(Object.assign(b,{q:qq,red:/^#?ff7e7e$/i.test(c.getAttribute('fill')||'')}));}};
  visit(root,false);
  let tg=shapes.filter(s=>s.q);if(!tg.length)tg=shapes.filter(s=>s.red);if(!tg.length)tg=shapes;
  return {W:W,H:H,shapes:tg};
}

/* ---------- reading the collection into a plan ---------- */
function akAnalyze(pkg){
  const db=pkg.db,meta=akMeta(db);
  const notes=new Map();
  for(const [id,mid,flds,tags] of akQ(db,'select id,mid,flds,tags from notes'))notes.set(id,{id:id,mid:mid,f:String(flds==null?'':flds).split('\x1f'),tags:String(tags||'').trim(),k:null});
  const cards=[];
  for(const r of akQ(db,'select id,nid,did,odid,ord,type,queue,due,odue,ivl,factor,reps,lapses,data from cards order by nid,ord')){
    const n=notes.get(r[1]);if(!n)continue;const m=meta.models[n.mid];if(!m)continue;
    if(!n.k)n.k=akKind(m,n);
    if(n.k==='io'){if(!n.ioN){const oc=n.f.find(v=>/image-occlusion:/.test(v))||'';n.ioN=new Set(akIOShapes(oc).map(s=>s.n));}if(!n.ioN.has(r[4]+1))continue;}
    cards.push({id:r[0],nid:r[1],did:r[3]||r[2],ord:r[4],type:r[5],queue:r[6],due:r[3]?r[8]:r[7],ivl:r[9],factor:r[10],reps:r[11],lapses:r[12],data:r[13],k:n.k});
  }
  const st=new Map();
  for(const c of cards){
    let s=st.get(c.did);if(!s){s={n:0,photo:0,text:0,rev:0,susp:0,imgs:new Set()};st.set(c.did,s);}
    s.n++;if(akPhoto(c.k)){s.photo++;const n=notes.get(c.nid);const fi=akIOImageField(meta.models[n.mid],n);if(fi>=0){const src=akImgSrc(n.f[fi]);if(src)s.imgs.add(src);}}else s.text++;
    if(c.type>0)s.rev++;if(c.queue===-1)s.susp++;
  }
  return {pkg:pkg,meta:meta,notes:notes,cards:cards,st:st};
}
function akFieldIdx(m,names,fallback){for(const nm of names){const i=m.flds.indexOf(nm);if(i>=0)return i;}return fallback;}
function akIOImageField(m,n){
  if(n.k==='ioe'){const i=akFieldIdx(m,['Image'],-1);if(i>=0)return i;}
  if(n.k==='io'){const i=akFieldIdx(m,['Image'],-1);if(i>=0&&/<img/i.test(n.f[i]))return i;}
  for(let i=0;i<n.f.length;i++)if(/<img/i.test(n.f[i])&&!/-[QAO]\.svg/i.test(n.f[i]))return i;
  return -1;
}
/* deck rows for the picker: every deck that has cards, with its ancestors */
function akRows(an){
  const D=an.meta.decks;const rows=new Map();
  const pathOf=did=>(D[did]&&D[did].length&&D[did][0]!=='')?D[did]:['Без названия'];
  an.st.forEach((s,did)=>{const p=pathOf(did);for(let i=1;i<=p.length;i++){const key=p.slice(0,i).join('\x1f');let r=rows.get(key);if(!r){r={key:key,path:p.slice(0,i),depth:i-1,dids:[],own:null,tot:0};rows.set(key,r);}r.tot+=s.n;if(i===p.length){r.dids.push(did);r.own=r.own?{n:r.own.n+s.n}:{n:s.n};}}});
  return Array.from(rows.values()).sort((a,b)=>a.key.localeCompare(b.key));
}

/* ---------- picker dialog ---------- */
function akSummary(an,sel,o){
  let photo=0,text=0,rev=0,susp=0,dup=0;const imgs=new Set();const have=new Set(S.cards.filter(c=>c.ai).map(c=>c.ai));
  for(const c of an.cards){if(!sel.has(c.did))continue;if(c.queue===-1){susp++;if(!o.susp)continue;}if(have.has(String(c.id))){dup++;continue;}
    if(akPhoto(c.k)){photo++;const n=an.notes.get(c.nid);const fi=akIOImageField(an.meta.models[n.mid],n);if(fi>=0)imgs.add(c.did+'|'+akImgSrc(n.f[fi]));}else text++;if(c.type>0)rev++;}
  return {photo:photo,text:text,rev:rev,susp:susp,dup:dup,imgs:imgs.size};
}
async function akPick(an){
  const rows=akRows(an);const all=new Set();an.st.forEach((s,did)=>all.add(did));
  const sel=new Set(all);const o={prog:true,susp:false};
  let totSusp=0,totRev=0;an.st.forEach(s=>{totSusp+=s.susp;totRev+=s.rev;});
  if(totSusp&&totSusp===an.cards.length)o.susp=true;
  const desc=r=>rows.filter(x=>x.key===r.key||x.key.indexOf(r.key+'\x1f')===0).reduce((a,x)=>a.concat(x.dids),[]);
  const rowHtml=r=>'<label class="ak-row" style="--d:'+r.depth+'"><input type="checkbox" data-key="'+esc(r.key)+'"><span class="ak-n" data-noi18n>'+esc(r.path[r.path.length-1])+'</span><span class="ak-c">'+r.tot+'</span></label>';
  const html='<div class="dlg ak"><h3>Импорт из Anki</h3><p class="ak-file"><span data-noi18n>'+esc(an.pkg.name)+'</span> · '+pl(an.cards.length,'карточка','карточки','карточек')+'</p>'+
    (rows.length>1?'<div class="ak-tree">'+rows.map(rowHtml).join('')+'</div>':'')+
    '<div class="ak-sum" id="akSum"></div>'+
    (totRev?'<label class="chk"><input type="checkbox" id="akProg" checked><span>Перенести прогресс из Anki</span></label>':'')+
    (totSusp?'<label class="chk"><input type="checkbox" id="akSusp"'+(o.susp?' checked':'')+'><span>Включая приостановленные ('+totSusp+')</span></label>':'')+
    '<div class="dlg-btns"><button class="btn line" data-s="0">Отмена</button><button class="btn primary" id="akGo">Импортировать</button></div></div>';
  const v=await showOverlay(html,ov=>{
    const boxes=$$('.ak-row input',ov);
    const sync=()=>{
      boxes.forEach(b=>{const r=rows.find(x=>x.key===b.dataset.key);const ds=desc(r);const n=ds.filter(d=>sel.has(d)).length;b.checked=n>0&&n===ds.length;b.indeterminate=n>0&&n<ds.length;});
      const s=akSummary(an,sel,o);const el=$('#akSum',ov);const parts=[];
      if(s.text)parts.push(pl(s.text,'текстовая карточка','текстовые карточки','текстовых карточек'));
      if(s.photo)parts.push(pl(s.photo,'рамка','рамки','рамок')+' ('+pl(s.imgs,'фото','фото','фото')+')');
      el.innerHTML='<b>'+esc(parts.length?'Будет добавлено: '+parts.join(' и ')+'.':'Ничего не выбрано.')+'</b>'+(s.rev&&o.prog?' <span>Изучавшиеся: '+s.rev+'.</span>':'')+(s.dup?' <span>Уже есть в Corpus: '+s.dup+' — пропущу.</span>':'')+(s.susp&&!o.susp?' <span>Приостановленные пропущу: '+s.susp+'.</span>':'');
      $('#akGo',ov).disabled=!(s.text+s.photo);
    };
    boxes.forEach(b=>b.onchange=()=>{const r=rows.find(x=>x.key===b.dataset.key);const ds=desc(r);const on=b.checked;ds.forEach(d=>{if(on)sel.add(d);else sel.delete(d);});sync();});
    const pg=$('#akProg',ov);if(pg)pg.onchange=()=>{o.prog=pg.checked;sync();};
    const sp=$('#akSusp',ov);if(sp)sp.onchange=()=>{o.susp=sp.checked;sync();};
    $('#akGo',ov).onclick=()=>dismissOverlay('go');
    $$('[data-s]',ov).forEach(b=>b.onclick=()=>dismissOverlay(null));
    sync();
  });
  if(v!=='go')return null;
  if(!totRev)o.prog=false;
  return {sel:sel,o:o};
}

/* ---------- scheduling: Anki card state → Corpus card state ---------- */
function akSched(c,crt){
  if(!c.type)return {type:'new'};
  const o={};const dayMs=d=>(crt+d*86400)*1000;
  if(c.type===2){o.type='review';o.ivl=Math.max(1,c.ivl|0);o.due=dayMs(c.due);}
  else{o.type=c.type===3?'relearn':'learn';o.step=0;o.ivl=c.type===3?Math.max(1,c.ivl|0):0;o.due=c.due>1e9?c.due*1000:dayMs(c.due);}
  o.ease=Math.max(1.3,(c.factor||2500)/1000);o.reps=c.reps|0;o.lapses=c.lapses|0;
  try{const d=JSON.parse(c.data||'{}');if(d.s>0&&d.d>=1){o.fs=+d.s;o.fd=Math.min(10,+d.d);}if(d.lrt>1e9)o.lr=d.lrt*1000;}catch(e){}
  if(!o.lr&&o.type==='review')o.lr=o.due-o.ivl*DAYMS;
  if(!isFinite(o.due))o.due=Date.now();
  return o;
}

/* ---------- storage: imported cards live in "packs" — many cards per document ----------
   The artifact's database holds at most 5 000 documents, an Anki deck alone can have more cards.
   A pack keeps up to ~100 KB of cards as a map {cardId: card}; a review writes only the changed
   card into its pack (a merge), so two devices studying the same deck don't overwrite each other. */
const PACKS=new Map();const PACK_MAX=100000;
const PACK_DEF={term:'',ease:2.5,ivl:0,step:0,reps:0,lapses:0,ok:0,miss:0};
function packNew(did){const pk=newId('packs');const P={deckId:did,ids:new Set(),dirty:new Set(),del:new Set(),kset:new Map(),saved:false};PACKS.set(pk,P);return pk;}
function packSlim(c,P){const o=clean(c);if(o.deckId===P.deckId)delete o.deckId;for(const k in PACK_DEF)if(o[k]===PACK_DEF[k])delete o[k];return o;}
function packAdd(cards){
  const byDeck=new Map();cards.forEach(c=>{if(!byDeck.has(c.deckId))byDeck.set(c.deckId,[]);byDeck.get(c.deckId).push(c);});
  const touched=[];
  byDeck.forEach((list,did)=>{let pk=null,size=0;
    for(const c of list){const sz=JSON.stringify(clean(c)).length+30;
      if(!pk||size+sz>PACK_MAX){pk=packNew(did);touched.push(pk);size=0;}
      c._pk=pk;PACKS.get(pk).ids.add(c.id);size+=sz;S.cards.push(c);}
  });
  if(S.db)touched.forEach(pk=>enq('packs/'+pk,{coll:'packs',id:pk,op:'pset'}));
}
function packBody(pk){
  const P=PACKS.get(pk);if(!P||!P.ids.size)return null;const c={};
  P.ids.forEach(id=>{const card=cardById(id);if(card){c[id]=packSlim(card,P);}});
  return {deckId:P.deckId,v:2,c:c};
}
function packTouch(c){const P=PACKS.get(c._pk);if(!P)return;P.dirty.add(c.id);if(S.db)enq('packs/'+c._pk,{coll:'packs',id:c._pk,op:'pset'});}
function packDrop(c){
  const P=PACKS.get(c._pk);if(!P)return;P.ids.delete(c.id);P.dirty.delete(c.id);if(P.saved)P.del.add(c.id);
  if(!P.ids.size){PACKS.delete(c._pk);if(S.db&&P.saved)enq('packs/'+c._pk,{coll:'packs',id:c._pk,op:'del'});else WQ.jobs.delete('packs/'+c._pk);return;}
  if(S.db)enq('packs/'+c._pk,{coll:'packs',id:c._pk,op:'pset'});
}
async function packWrite(pk){
  const P=PACKS.get(pk);if(!P||!P.ids.size)return;const ref=S.db.collection('packs').doc(pk);
  const full=async()=>{const body=packBody(pk);if(!body)return;P.dirty.clear();P.del.clear();await ref.set(body);P.saved=true;P.kset=new Map(Object.keys(body.c).map(id=>[id,Object.keys(body.c[id])]));};
  if(!P.saved){await full();return;}
  const dirty=Array.from(P.dirty),del=Array.from(P.del);P.dirty.clear();P.del.clear();
  const c={},ks=[];
  dirty.forEach(id=>{const card=cardById(id);if(!card||card._pk!==pk)return;const o=packSlim(card,P);(P.kset.get(id)||[]).forEach(k=>{if(!(k in o))o[k]=null;});c[id]=o;ks.push([id,Object.keys(o).filter(k=>o[k]!==null)]);});
  del.forEach(id=>{c[id]=null;});
  if(!Object.keys(c).length)return;
  try{await ref.update({c:c});}
  catch(e){if(e&&e.code==='invalid_argument'){P.saved=false;await full();return;}dirty.forEach(id=>P.dirty.add(id));del.forEach(id=>P.del.add(id));throw e;}
  ks.forEach(a=>P.kset.set(a[0],a[1]));del.forEach(id=>P.kset.delete(id));
}
function packLoad(docs){
  docs.forEach(x=>{const d=x.data()||{};const P={deckId:d.deckId,ids:new Set(),dirty:new Set(),del:new Set(),kset:new Map(),saved:true};
    const m=d.c&&typeof d.c==='object'?d.c:{};
    Object.keys(m).forEach(id=>{const o=m[id];if(!o||typeof o!=='object')return;const r={deckId:d.deckId};const keys=[];
      for(const k in o){if(o[k]!==null&&o[k]!==undefined){r[k]=o[k];keys.push(k);}}
      const c=normCard(Object.assign(r,{id:id}));c._pk=x.id;S.cards.push(c);P.ids.add(id);P.kset.set(id,keys);});
    if(P.ids.size)PACKS.set(x.id,P);});
}
function dbDocCount(){return S.decks.length+S.folders.length+S.plates.filter(p=>!p._local).length+S.cards.filter(c=>!c._pk).length+Object.keys(S.stats).length+PACKS.size+1;}

/* ---------- the import itself ---------- */
async function akUpload(blob){

async function chatImage(p,box){
  try{
    const img=await loadImage(plateUrl(p));const s=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*s);cv.height=Math.round(img.naturalHeight*s);
    const x=cv.getContext('2d');x.drawImage(img,0,0,cv.width,cv.height);
    if(box&&isArrow(box)){const W=cv.width,H=cv.height,x1=box.bx/100*W,y1=box.by/100*H,x2=box.ax/100*W,y2=box.ay/100*H,lw=Math.max(4,W/220),a=Math.atan2(y2-y1,x2-x1),hl=lw*5;
      x.strokeStyle=x.fillStyle='#e0181b';x.lineWidth=lw;x.lineCap='round';x.beginPath();x.moveTo(x1,y1);x.lineTo(x2-Math.cos(a)*hl*0.6,y2-Math.sin(a)*hl*0.6);x.stroke();
      x.beginPath();x.moveTo(x2,y2);x.lineTo(x2-hl*Math.cos(a)+hl*0.42*Math.sin(a),y2-hl*Math.sin(a)-hl*0.42*Math.cos(a));x.lineTo(x2-hl*Math.cos(a)-hl*0.42*Math.sin(a),y2-hl*Math.sin(a)+hl*0.42*Math.cos(a));x.closePath();x.fill();}
    else if(box){x.strokeStyle='#e0181b';x.lineWidth=Math.max(3,cv.width/300);const pad=4;x.strokeRect(box.x/100*cv.width-pad,box.y/100*cv.height-pad,box.w/100*cv.width+pad*2,box.h/100*cv.height+pad*2);}
    return await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
  }catch(e){return null;}
}
const CH_INSTR='Ты — дружелюбный репетитор по анатомии человека для студента-медика. Отвечай по-русски, коротко и по делу (обычно 3–8 предложений), латинские термины пиши на латыни. Объясняй просто, с примерами и ассоциациями. Если не уверен — так и скажи. Без длинных вступлений.';
async function chatSend(text){
  text=String(text||'').trim();if(!text||CH.busy||!chatAvailable())return;
  const inp=$('#chIn');if(inp){inp.value='';inp.style.height='auto';}
  const cx=chatCtx();
  let images=null,imgNote='';
  if(S.imgOK&&cx.plate&&CH.imgFor!==cx.key){const b=await chatImage(cx.plate,cx.box);if(b){images=b;CH.imgFor=cx.key;imgNote=' К сообщению приложено фото страницы атласа'+(cx.box?'; отмеченная структура обведена красной рамкой':'')+'.';}}
  CH.turns=CH.turns.filter(t=>!t.err);
  CH.turns.push({role:'user',content:text,ctx:cx.text+imgNote});
  const ans={role:'assistant',content:'Думаю…',wait:true};CH.turns.push(ans);CH.busy=true;chatRender();
  const hist=CH.turns.filter(t=>t!==ans&&!t.err).slice(-16);
  const turns=hist.map((t,i)=>({role:t.role,content:(i===0?chatInstr()+'\n\n':'')+(t.role==='user'&&t.ctx?'[Контекст: '+t.ctx+']\n\n':'')+t.content}));
  if(turns[0].role!=='user')turns.shift();
  const ctl=new AbortController();CH.ctl=ctl;
  try{
    const r=await S.sample(turns,{cache:false,signal:ctl.signal,images:images||undefined,onText:u=>{ans.content=u.text;ans.wait=false;chatRenderLast(ans);}});
    ans.content=r.text||'…';ans.wait=false;
  }catch(e){
    const code=e&&e.code;
    if(code==='cancelled'){ans.content=(e.text||ans.content||'').replace(/^Думаю…$/,'')||'Остановлено.';ans.wait=false;}
    else{
      CH.turns.pop();if(e&&e.text){ans.content=e.text;ans.wait=false;CH.turns.push(ans);}
      const msg=code==='quota_exceeded'?'Лимит ИИ на сегодня исчерпан — он обновится завтра.':code==='not_granted'||code==='sampling_disabled'?'Доступ к Claude для этой страницы не разрешён.':code==='rate_limited'?'Слишком много вопросов подряд — подождите минуту.':code==='images_unavailable'||code==='image_rejected'?'Фото не удалось отправить — спросите ещё раз, без фото.':'Не получилось получить ответ. Попробуйте ещё раз.';
      if(code==='not_granted'||code==='sampling_disabled')CH.dead=true;
      if(code==='images_unavailable')S.imgOK=false;
      if(images)CH.imgFor=null;
      CH.turns.push({role:'assistant',content:msg,err:true});
    }
  }
  CH.busy=false;CH.ctl=null;chatRender();
}

  root.addEventListener('touchstart',e=>{
    g=null;if(e.touches.length!==1||!SS||!SS.cur)return;const t=e.touches[0];
    if(!zone(e.target)||t.clientX<22||t.clientX>innerWidth-22)return;

  prAll:()=>{cardsOfPlate(PR.plateId).filter(c=>!(isArrow(c)&&!c.term)).forEach(c=>PR.open.add(c.id));updPr();},
  prNone:()=>{PR.open.clear();PR.last=null;updPr();},
  cropCancel:()=>cropCancel(),
  cropApply:()=>cropApply(),

function recoverFromError(e){
  console.error('Corpus error:',e);hideBusy();
  try{
    if(view.name==='study'&&SS&&SS.cur){
      SS.exclude=SS.exclude||new Set();SS.exclude.add(SS.cur);
      SS.recoverCount=(SS.recoverCount||0)+1;
      const det=e&&(e.message||String(e));const short=det?(' ('+String(det).slice(0,70)+')'):'';
      if(SS.recoverCount<=6){toast('Что-то пошло не так — карточка пропущена'+short,4200);nextCard();return;}
      SS.cur=null;render();toast('Повторение прервано ошибкой — откройте колоду заново');return;
    }
    render();
  }catch(e2){console.error(e2);try{view={name:'home'};render();}catch(e3){}}
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled||!(app.contains(el)||(QS.el&&QS.el.contains(el))))return;
  const f=A[el.dataset.act];if(!f)return;
  e.preventDefault();
  try{f(el,e);}catch(err){recoverFromError(err);}
});
window.addEventListener('error',e=>{if(e&&e.error)recoverFromError(e.error);});
window.addEventListener('unhandledrejection',e=>{recoverFromError(e&&e.reason);});
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.closest&&e.target.closest('#chat')){if(e.key==='Escape')chatToggle(false);return;}
  if(layer.firstChild){if(e.key==='Escape')dismissOverlay(null);return;}
  if(QS.open){QS.kbd=true;if(e.key==='Escape'){e.preventDefault();qsClose();}return;}
  if($('#busy'))return;
  const typing=/^(input|textarea|select)$/i.test(e.target.tagName||'');const mod=e.metaKey||e.ctrlKey;
  if(view.name==='study'&&SS&&SS.cur){
    if(typing){if(e.key==='Enter'&&SS.phase==='ask'&&SS.cm==='type'){e.preventDefault();doCheck(false);}return;}
    if(e.key==='z'||e.key==='я'||(mod&&e.key.toLowerCase()==='z')){e.preventDefault();undoStudy();return;}
    if((e.key==='p'||e.key==='з')&&!mod&&META.speakOn){const c=cardById(SS.cur);const t=SS.phase==='answer'?latinAnswerOf(c):(isText(c)&&c.dir!=='r'?qOf(c):'');if(t){e.preventDefault();speak(t);}return;}
    const ARW={ArrowLeft:1,ArrowDown:2,ArrowRight:3,ArrowUp:4};
    if(ARW[e.key]&&e.repeat){e.preventDefault();return;}
    if(SS.phase==='ask'){
      if((e.key===' '||e.key==='Enter'||ARW[e.key])&&revealMode()){e.preventDefault();doReveal();}
      else if(SS.cm==='choice'&&/^[1-4]$/.test(e.key))doPick(+e.key-1);
    }else{
      let r=0,arrow=false;if(/^[1-4]$/.test(e.key))r=+e.key;else if(ARW[e.key]){e.preventDefault();r=ARW[e.key];arrow=true;}else if(e.key===' '||e.key==='Enter'){e.preventDefault();r=SS.suggest||3;}
      if(r){if(SS.cram)r=(arrow?r<=2:r===1)?1:3;if(!RATING){const b=$('#panel .rate .r'+r);if(b)floatFx(b,r);}rate(r);}
    }
  }else if(view.name==='editor'&&ED){
    if(typing){
      if(e.key==='Enter'){
        e.preventDefault();
        if(e.target&&e.target.id==='termIn'&&ED.sel){
          const next=nearestUnnamed(ED.sel);
          if(next){select(next.id);const i=$('#termIn');if(i)i.focus();return;}
        }
        edDone();
      }else if(e.key==='Escape'){e.preventDefault();edDone();}
      return;
    }
    if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();edUndo();}
    else if((e.key==='Delete'||e.key==='Backspace')&&ED.sel){e.preventDefault();edDelete();}
    else if(e.key==='Escape'&&ED.sel)edDone();
    else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&!mod&&!e.altKey){e.preventDefault();if(!e.repeat)edGo(e.key==='ArrowLeft'?-1:1);}
  }else if(view.name==='practice'&&PR){
    if(typing)return;
    if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&!mod&&!e.altKey){e.preventDefault();if(!e.repeat)prGo(e.key==='ArrowLeft'?-1:1);}
  }
});

/* ---------- boot ---------- */
async function boot(){
  setLang(detectLang());
  applyLook();
  render();
  const cl=window.claude;
  if(cl&&cl.use){
    const r=await Promise.all(['db','assets','sample','downloads','user'].map(n=>cl.use(n).catch(()=>null)));
    S.db=r[0];S.assets=r[1];S.sample=r[2];S.downloads=r[3];S.user=r[4];
    if(S.sample&&S.sample.limits){try{const l=await S.sample.limits();S.imgOK=!!(l&&l.images);}catch(e){}}
    /* someone else's link: this artifact's data belongs to its owner, so a visitor gets a way to make their own copy instead */
    if(S.user){try{const own=await S.user.isOwner();if(own===false&&(await S.user.canEdit())!==true)S.foreign=true;}catch(e){}}
  }
  if(S.foreign){S.ready=true;NAV='enter-tab';view={name:'foreign'};render();return;}
  await bootData();
}
async function bootData(){
  if(S.db){
    try{
      const g=await Promise.all(['decks','plates','terms','stats','folders','packs'].map(n=>S.db.collection(n).get()));
      try{const m=await S.db.collection('meta').doc('settings').get();if(m.exists){const md=m.data()||{};META.lastBackup=md.lastBackup||0;if(md.hintAfter!=null)META.hintAfter=md.hintAfter;if(md.hintShows!=null)META.hintShows=md.hintShows;if(md.mode)META.mode=md.mode;['calm','theme','fs','autoRate','swipe','tipSwipe','tipKeys','autoSpeak','sessLimit','seeThrough','speakOn','algo','retention','autoOcr','tips','tipN','latFix'].forEach(k=>{if(md[k]!=null)META[k]=md[k];});applyLook();}}catch(e){}
      S.decks=g[0].docs.map(x=>Object.assign({},x.data(),{id:x.id,newToday:x.data()&&x.data().newToday?Object.assign({},x.data().newToday):undefined}));
      S.plates=g[1].docs.map(x=>Object.assign({},x.data(),{id:x.id}));
      S.cards=g[2].docs.map(x=>normCard(Object.assign({},x.data(),{id:x.id})));
      g[3].docs.forEach(x=>{const raw=x.data()||{};const days={};Object.keys(raw.days||{}).forEach(k=>{days[k]=Object.assign({n:0,ok:0},raw.days[k]);});S.stats[x.id]={id:x.id,days:days};});
      S.folders=g[4].docs.map(x=>Object.assign({},x.data(),{id:x.id}));
      packLoad(g[5].docs);
      S.decks.forEach(d=>{if(d.newPerDay==null)d.newPerDay=20;if(!d.createdAt)d.createdAt=0;});
      S.folders.forEach(f=>{if(!f.createdAt)f.createdAt=0;});
    }catch(e){S.loadErr=true;}
  }
  S.ready=true;NAV='enter-tab';view={name:'home'};render();
  S.cards.filter(c=>c._mig).forEach(c=>{delete c._mig;persist('terms',c.id);});
  const W=window.CORPUS_WEB;
  if(W&&W.shareCode&&sharesApi()){const code=W.shareCode;if(W.clearShareCode)W.clearShareCode();setTimeout(()=>openShareCode(code),400);}
}
