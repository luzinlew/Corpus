# Выкладка Edge Functions Supabase (corpus-ai, corpus-push) из этого репозитория.
# Запускается при push в main, если менялось что-то в supabase/functions/**, и вручную
# (Actions -> Deploy Supabase functions -> Run workflow).
# Нужен секрет репозитория SUPABASE_ACCESS_TOKEN (Supabase -> Account -> Access Tokens), см. README, «Выкладка функций из GitHub».
# Секреты самих функций (ANTHROPIC_API_KEY и др.) остаются в Supabase, этот файл их не трогает. SQL здесь не выполняется.
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

# Одна выкладка за раз; идущую не отменяем, следующая ждёт.
concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Публичные данные из config.js: адрес проекта Supabase и его идентификатор.
  PROJECT_REF: iymempapqvbwcaclwnvk
  FUNCTIONS_URL: https://iymempapqvbwcaclwnvk.supabase.co/functions/v1

jobs:
  deploy:
    # Только в самом репозитории (не в форках) и только код из main: ручной запуск с другой ветки ничего не выложит.
    if: github.repository == 'luzinlew/Corpus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # latest: всегда свежая версия CLI. Если новая версия что-то сломает, вместо latest можно закрепить конкретную (номера — в релизах github.com/supabase/cli).
          version: latest

      - name: Проверить секрет SUPABASE_ACCESS_TOKEN
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Не задан секрет SUPABASE_ACCESS_TOKEN. Supabase -> Account -> Access Tokens -> Generate new token, затем GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret с именем SUPABASE_ACCESS_TOKEN. Функции пока можно вставить в Supabase -> Edge Functions вручную."
            exit 1
          fi

      # Обе функции работают с выключенным Verify JWT (README, supabase/push.sql): человека они проверяют сами.
      - name: Выложить corpus-ai
        run: supabase functions deploy corpus-ai --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Выложить corpus-push
        run: supabase functions deploy corpus-push --no-verify-jwt --project-ref "$PROJECT_REF"

      # Функция ответила на запрос после выкладки (OPTIONS отвечает до всякой работы с базой): значит, она загрузилась и запускается.
      - name: Проверить, что corpus-ai загрузилась
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$FUNCTIONS_URL/corpus-ai" || true)
            echo "corpus-ai: OPTIONS -> HTTP $code (попытка $i из 5)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 6
          done
          echo "::error::corpus-ai не ответила 200 на OPTIONS после выкладки. Откройте Supabase -> Edge Functions -> corpus-ai -> Logs; при необходимости вставьте прежний код функции вручную."
          exit 1

      # Для corpus-push тоже только OPTIONS: любой другой запрос заходит в базу (читает настройки и может создать VAPID-ключи),
      # а запуск по расписанию ещё и рассылает уведомления. OPTIONS отвечает до этого; ошибка загрузки модуля дала бы 5xx.
      - name: Проверить, что corpus-push загрузилась
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$FUNCTIONS_URL/corpus-push" || true)
            echo "corpus-push: OPTIONS -> HTTP $code (попытка $i из 5)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 6
          done
          echo "::error::corpus-push не ответила 200 на OPTIONS после выкладки. Откройте Supabase -> Edge Functions -> corpus-push -> Logs."
          exit 1
