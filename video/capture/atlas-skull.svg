<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <defs>
    <radialGradient id="bone" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fbf4e2"/>
      <stop offset=".65" stop-color="#eadbb9"/>
      <stop offset="1" stop-color="#cdb88f"/>
    </radialGradient>
    <radialGradient id="jaw" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#f6ecd4"/>
      <stop offset="1" stop-color="#cbb48a"/>
    </radialGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#6b5434" stroke-width="1.1" opacity=".55"/>
    </pattern>
    <pattern id="hatch2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#4d3b22" stroke-width="1.2" opacity=".7"/>
    </pattern>
    <radialGradient id="hole" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#2b2116"/>
      <stop offset="1" stop-color="#5b4630"/>
    </radialGradient>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .33  0 0 0 .06 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>
  <rect width="1400" height="1000" fill="#f5eedd"/>
  <rect width="1400" height="1000" fill="#fff" filter="url(#paper)"/>
  <text x="700" y="62" text-anchor="middle" font-family="DejaVu Serif" font-size="26" fill="#3c3022" letter-spacing="3">CRANIUM · NORMA LATERALIS</text>
  <line x1="560" y1="78" x2="840" y2="78" stroke="#8a7350" stroke-width="1"/>

  <g stroke="#3b2d1d" stroke-linejoin="round" stroke-linecap="round">
    <!-- mandible -->
    <path d="M560 600 C 545 640 535 690 540 735 L 560 735 Z" fill="url(#hatch2)" stroke="none" opacity=".8"/>
    <path d="M782 588 C 790 640 784 720 770 790 C 764 812 742 822 715 822 L 470 820 C 430 822 400 812 388 790 C 378 772 380 752 386 735 L 560 735 C 575 690 600 630 628 586 C 650 600 675 620 700 622 C 725 615 745 595 760 580 Z" fill="url(#jaw)" stroke-width="3"/>
    <path d="M770 790 C 760 740 745 700 720 680 C 740 730 745 780 735 818 Z" fill="url(#hatch)" stroke="none"/>
    <path d="M400 800 C 460 812 560 812 700 806" fill="none" stroke-width="1.4" opacity=".6"/>
    <path d="M640 620 C 660 660 690 690 730 700" fill="none" stroke-width="1.3" opacity=".5"/>
    <ellipse cx="470" cy="770" rx="7" ry="5" fill="url(#hole)" stroke-width="1.5"/>
    <!-- cranium -->
    <path d="M360 420 C 345 330 400 230 500 190 C 600 150 720 150 820 190 C 920 230 990 300 1005 390 C 1015 450 1000 510 965 555 C 940 585 905 600 870 610 L 860 640 C 856 668 846 686 836 686 C 826 686 820 668 818 640 L 800 600 C 760 590 735 585 720 572 L 560 590 C 530 596 520 640 522 690 L 360 690 C 350 650 342 610 340 590 C 320 560 305 520 305 500 C 330 470 352 446 360 420 Z" fill="url(#bone)" stroke-width="3.2"/>
    <!-- shading under the base -->
    <path d="M870 610 C 905 600 940 585 965 555 C 985 525 995 490 998 450 C 980 500 945 545 880 575 Z" fill="url(#hatch)" stroke="none"/>
    <path d="M818 640 C 822 668 828 684 836 686 C 846 686 856 668 860 640 C 850 650 830 650 818 640 Z" fill="url(#hatch2)" stroke="none"/>
    <!-- orbit -->
    <path d="M372 420 C 395 395 455 392 488 418 C 505 445 500 500 480 525 C 450 545 400 540 380 515 C 365 490 362 448 372 420 Z" fill="url(#hole)" stroke-width="3"/>
    <path d="M395 430 C 420 415 460 418 475 440" fill="none" stroke="#a48b63" stroke-width="2" opacity=".7"/>
    <!-- nasal bone + aperture -->
    <path d="M360 420 C 350 450 330 478 305 500" fill="none" stroke-width="3"/>
    <path d="M305 500 C 312 530 325 560 342 588 C 352 575 356 552 352 525 C 345 510 328 503 305 500 Z" fill="url(#hole)" stroke-width="2.4"/>
    <!-- zygomatic bone + arch -->
    <path d="M470 525 C 500 545 520 575 540 595 C 600 585 660 570 720 572 C 735 565 750 555 765 556 C 740 545 700 540 650 545 C 600 548 560 540 535 520 C 510 500 492 505 470 525 Z" fill="#f3e6c6" stroke-width="2.6"/>
    <path d="M560 560 C 620 555 680 552 740 558" fill="none" stroke-width="1.3" opacity=".55"/>
    <!-- temporal fossa shading -->
    <path d="M540 520 C 580 470 640 440 720 440 C 780 445 820 480 830 530 C 790 530 760 545 740 545 C 680 540 600 545 540 520 Z" fill="url(#hatch)" stroke="none" opacity=".75"/>
    <!-- external acoustic meatus -->
    <ellipse cx="792" cy="565" rx="22" ry="25" fill="url(#hole)" stroke-width="2.6"/>
    <!-- styloid -->
    <path d="M800 600 L 790 660 L 796 660 L 808 602" fill="#e9dcbc" stroke-width="1.6"/>
    <!-- maxilla detail -->
    <path d="M352 525 C 380 545 420 560 470 560 C 500 570 520 580 540 595" fill="none" stroke-width="1.6" opacity=".7"/>
    <ellipse cx="410" cy="580" rx="6" ry="4.5" fill="url(#hole)" stroke-width="1.4"/>
    <path d="M360 690 C 420 680 480 678 522 690" fill="none" stroke-width="2"/>
    <!-- sutures -->
    <path d="M598 160 l6 18 -8 14 9 16 -7 16 9 18 -9 15 8 17 -8 16 9 18 -10 14 7 18 -9 17 8 16 -9 14 7 18 -10 16 6 15 -8 13" fill="none" stroke-width="2"/>
    <path d="M598 470 C 640 420 700 395 760 405 C 810 415 840 455 845 520" fill="none" stroke-width="2" stroke-dasharray="7 4"/>
    <path d="M905 238 l-4 18 9 13 -7 17 8 15 -8 17 9 14 -7 18 8 15 -7 17 9 15 -6 18 8 15 -6 17 8 16 -4 14" fill="none" stroke-width="2"/>
    <path d="M520 300 C 600 250 720 240 830 270 C 900 290 950 340 965 410" fill="none" stroke-width="1.3" stroke-dasharray="3 6" opacity=".7"/>
    <!-- upper teeth -->
    <g fill="#fbf6ea" stroke-width="1.8">
      <path d="M372 690 h22 v22 q-11 12 -22 0 z"/><path d="M396 690 h22 v26 q-11 10 -22 0 z"/>
      <path d="M420 690 h20 v28 q-10 8 -20 0 z"/><path d="M442 690 h24 v26 q-12 9 -24 0 z"/>
      <path d="M468 690 h26 v24 q-13 9 -26 0 z"/><path d="M496 690 h26 v22 q-13 9 -26 0 z"/>
    </g>
    <!-- lower teeth -->
    <g fill="#fbf6ea" stroke-width="1.8">
      <path d="M386 735 h22 v-14 q-11 -10 -22 0 z"/><path d="M410 735 h22 v-16 q-11 -10 -22 0 z"/>
      <path d="M434 735 h22 v-18 q-11 -8 -22 0 z"/><path d="M458 735 h26 v-18 q-13 -9 -26 0 z"/>
      <path d="M486 735 h28 v-17 q-14 -9 -28 0 z"/><path d="M516 735 h28 v-16 q-14 -9 -28 0 z"/>
    </g>
  </g>

  <!-- leader lines -->
  <g stroke="#2a2118" stroke-width="1.4" fill="none">
    <path d="M262 232 L 520 250"/>
    <path d="M262 452 L 338 462"/>
    <path d="M262 612 L 400 612"/>
    <path d="M262 792 L 440 792"/>
    <path d="M262 532 L 520 572"/>
    <path d="M1100 212 L 740 230"/>
    <path d="M1100 332 L 590 330"/>
    <path d="M1100 452 L 980 452"/>
    <path d="M1100 522 L 700 480"/>
    <path d="M1100 592 L 812 568"/>
    <path d="M1100 662 L 842 664"/>
    <path d="M1100 732 L 640 605"/>
  </g>
  <g font-family="DejaVu Serif" font-style="italic" font-size="25" fill="#1d1710">
    <text x="252" y="240" text-anchor="end">Os frontale</text>
    <text x="252" y="460" text-anchor="end">Os nasale</text>
    <text x="252" y="540" text-anchor="end">Os zygomaticum</text>
    <text x="252" y="620" text-anchor="end">Maxilla</text>
    <text x="252" y="800" text-anchor="end">Mandibula</text>
    <text x="1110" y="220">Os parietale</text>
    <text x="1110" y="340">Sutura coronalis</text>
    <text x="1110" y="460">Os occipitale</text>
    <text x="1110" y="530">Os temporale</text>
    <text x="1110" y="600">Porus acusticus</text>
    <text x="1110" y="670">Proc. mastoideus</text>
    <text x="1110" y="740">Proc. coronoideus</text>
  </g>
  <text x="1340" y="960" text-anchor="end" font-family="DejaVu Serif" font-size="18" fill="#7a6648">Tab. 12</text>
</svg>
