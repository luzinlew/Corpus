<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Corpus — анатомия по изображениям</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Source+Serif+4:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --surface2:#F4F6F5; --ink:#16201C; --ink2:#56645E; --ink3:#8E9B96; --line:#D9DFDC;
  --primary:#1E5A54; --primary-ink:#FFFFFF; --primary-soft:#DDEBE8;
  --new:#2C6BD1; --learn:#CC4430; --due:#2A8749;
  --new-soft:#E3EBFA; --learn-soft:#FAE6E2; --due-soft:#E2F1E7;
  --young:#8CCB9F; --mature:#2A8749;
  --mask:#F3B83F; --mask-edge:#C68A0D; --target:#E1543A; --target-edge:#A63620;
  --ok:#2A8749; --bad:#CC4430; --hard:#5E6A65; --easy:#2C6BD1;
  --ok-soft:#E2F1E7; --bad-soft:#FAE6E2; --hard-soft:#E9EDEB; --easy-soft:#E3EBFA;
  --warn-soft:#FCF0D5; --warn-ink:#6E4B00;
  --h0:#E4E9E6; --h1:#C9E5D2; --h2:#94CDA6; --h3:#55A872; --h4:#2A8749;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="paper"]){
    --bg:#111614; --surface:#1A211E; --surface2:#222A27; --ink:#E7EDEA; --ink2:#9CAAA4; --ink3:#6C7A74; --line:#2D3833;
    --primary:#63B5AA; --primary-ink:#0D1513; --primary-soft:#1D3431;
    --new:#7EA8F2; --learn:#F08A75; --due:#6CC58B;
    --new-soft:#1C2940; --learn-soft:#3A221D; --due-soft:#1B3325;
    --young:#3E7A52; --mature:#6CC58B;
    --ok:#6CC58B; --bad:#F08A75; --hard:#A5B2AC; --easy:#7EA8F2;
    --ok-soft:#1B3325; --bad-soft:#3A221D; --hard-soft:#27302C; --easy-soft:#1C2940;
    --warn-soft:#3A3017; --warn-ink:#F0CE7E;
    --h0:#222A27; --h1:#1E3A2A; --h2:#2B5C3E; --h3:#3F8C5A; --h4:#6CC58B;
  }
}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A211E; --surface2:#222A27; --ink:#E7EDEA; --ink2:#9CAAA4; --ink3:#6C7A74; --line:#2D3833;
  --primary:#63B5AA; --primary-ink:#0D1513; --primary-soft:#1D3431;
  --new:#7EA8F2; --learn:#F08A75; --due:#6CC58B;
  --new-soft:#1C2940; --learn-soft:#3A221D; --due-soft:#1B3325;
  --young:#3E7A52; --mature:#6CC58B;
  --ok:#6CC58B; --bad:#F08A75; --hard:#A5B2AC; --easy:#7EA8F2;
  --ok-soft:#1B3325; --bad-soft:#3A221D; --hard-soft:#27302C; --easy-soft:#1C2940;
  --warn-soft:#3A3017; --warn-ink:#F0CE7E;
  --h0:#222A27; --h1:#1E3A2A; --h2:#2B5C3E; --h3:#3F8C5A; --h4:#6CC58B;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.38}
:focus-visible{outline:2.5px solid var(--new);outline-offset:2px}
#app{height:100%}
.latin{font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-style:italic}
.muted{color:var(--ink2)}
.i{flex:none}

/* layout */
.page{max-width:760px;margin:0 auto;padding:10px 16px 56px}
.full{height:100%;display:flex;flex-direction:column;max-width:none;margin:0 auto}
.center{height:100%;display:flex;align-items:center;justify-content:center}

/* buttons */
.ibtn{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0}
.ibtn.plain{border-color:transparent;background:transparent}
.ibtn.sm{width:34px;height:34px;border-radius:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid transparent;font-weight:600;font-size:15px;background:var(--surface);color:var(--ink);text-align:center}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.line{border-color:var(--line)}
.btn.quiet{background:transparent;color:var(--ink2)}
.btn.danger{color:var(--bad)}
.btn.dangerfill{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:17px;border-radius:14px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn small{font-weight:500;color:var(--ink3);font-size:12.5px}
.btn.stack{flex-direction:column;gap:0;padding:6px 16px;line-height:1.3}
.btn,.ibtn,.mode,.deck,.tile,.opt,.rate button,.sitem,.tabbar button,.crow{transition:transform .22s cubic-bezier(.34,1.56,.64,1),background-color .2s,border-color .2s,box-shadow .25s,color .2s}
.btn:active:not(:disabled),.ibtn:active:not(:disabled),.mode:active,.deck:active,.opt:active,.rate button:active,.tile-img:active,.crow:active{transform:scale(.955);transition-duration:.08s}

/* home */
.hhead{display:flex;align-items:center;justify-content:space-between;padding:8px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Source Serif 4',Georgia,serif;font-style:italic;font-weight:600;font-size:28px;letter-spacing:.2px}
.brand-mark{display:inline-flex;align-items:center;gap:4px}
.brand-mark i{display:block;width:18px;height:2px;background:var(--ink)}
.brand-mark b{display:block;width:26px;height:16px;border-radius:3px;background:var(--mask);box-shadow:inset 0 0 0 1.5px var(--mask-edge)}
.banner{background:var(--warn-soft);color:var(--warn-ink);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.today{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:26px}
.today-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.h1t{flex:1;min-width:0;font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h2{font-weight:600;font-size:17px}
.sm{font-size:13px}
.stattiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 16px}
.stattile{display:flex;flex-direction:column;gap:6px;border-radius:16px;padding:12px 10px;min-height:82px}
.stattile b{font-size:23px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stattile span{font-size:11.5px;font-weight:600;opacity:.85}
.stattile.new{background:var(--new-soft);color:var(--new)}
.stattile.due{background:var(--due-soft);color:var(--due)}
.stattile.learn{background:var(--learn-soft);color:var(--learn)}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:760px;z-index:40;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:6px 2px;border-radius:12px;color:var(--ink3);font-size:10.5px;font-weight:600}
.tabbar button.on{color:var(--primary)}
.tabpill{position:absolute;z-index:0;left:4px;top:6px;bottom:calc(6px + env(safe-area-inset-bottom,0px));width:calc((100% - 8px) / 4);border-radius:14px;background:var(--primary-soft);transition:transform .5s cubic-bezier(.34,1.45,.64,1)}
.tabbar button.bump .i{animation:tabBump .5s cubic-bezier(.34,1.56,.64,1)}
.page.tabbed{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.counts{display:flex;gap:26px;margin:10px 0 14px}
.counts>div{display:flex;flex-direction:column}
.counts b{font-size:28px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.counts span{font-size:13px;color:var(--ink2)}
.c-new{color:var(--new)} .c-learn{color:var(--learn)} .c-due{color:var(--due)}
.zero{color:var(--ink3)!important}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
.deck{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px 10px 10px;margin-bottom:8px}
.thumb{width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--surface2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.deck.folder .thumb{color:#B8862B;background:rgba(184,134,43,.12)}
.deck.textdeck .thumb{color:var(--primary);background:var(--primary-soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dname{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmeta{font-size:13px;color:var(--ink2)}
.dprog{height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}
.dprog i{display:block;height:100%;background:var(--primary);border-radius:4px}
.dpct{font-size:11.5px;color:var(--ink2);font-weight:600}
.dcounts{display:flex;gap:12px;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.dcounts b{min-width:16px;text-align:right}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:28px 20px;text-align:center;color:var(--ink2)}
.empty .btn{margin-top:14px}
.demo{display:flex;align-items:center;justify-content:center;gap:0;margin:6px 0 16px}
.demo-line{display:block;width:70px;height:2px;background:var(--ink2)}
.demo-mask{display:flex;align-items:center;justify-content:center;width:96px;height:26px;border-radius:4px;background:var(--target);box-shadow:inset 0 0 0 1.5px var(--target-edge);color:#fff;font-weight:700}

/* deck */
.pbar{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.pbar h1{flex:1;min-width:0;margin:0;font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overview{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px}
.overview .counts{margin-top:0}
.onboard p{margin:0 0 16px;color:var(--ink2);text-align:center;line-height:1.55}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 14px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.mode .i{color:var(--ink2)}
.mode b{font-size:14.5px;font-weight:600}
.mode span{font-size:12px;color:var(--ink2);line-height:1.3}
.mode.on{border-color:var(--primary);background:var(--primary-soft)}
.mode.on .i{color:var(--primary)}
.alldone{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--due-soft);margin-bottom:4px}
.alldone b{color:var(--due)}
.alldone span{font-size:13.5px;color:var(--ink2)}
.overview .btn.quiet{margin-top:6px}
.tabs{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.tabs button{flex:1;border:none;background:none;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink2)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tile-img{display:flex;align-items:center;justify-content:center;border:none;padding:0;background:var(--surface2);aspect-ratio:4/3;width:100%;overflow:hidden;color:var(--ink3)}
.tile-img img{width:100%;height:100%;object-fit:cover;display:block}
.tile-foot{display:flex;align-items:center;justify-content:space-between;padding:3px 3px 3px 10px;font-size:13px;color:var(--ink2)}
.tile.add{align-items:center;justify-content:center;gap:6px;border-style:dashed;border-width:1.5px;color:var(--ink2);min-height:152px;background:transparent;font-weight:600}
.tile.excluded .tile-img{opacity:.4}
.tile.excluded .tile-foot{color:var(--ink3)}
.search{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;font-size:16px;margin-bottom:10px}
.clist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.crow{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:none;border-bottom:1px solid var(--line);background:none;text-align:left}
.crow:last-child{border-bottom:none}
.crow .t{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .t.none{font-family:inherit;font-style:normal;color:var(--ink3);font-size:14px}
.crow .cp{font-size:12px;color:var(--ink3);flex:none}
.st{font-size:12px;font-weight:600;padding:3px 8px;border-radius:20px;flex:none;white-space:nowrap}
.st-new{color:var(--new);background:var(--new-soft)} .st-learn{color:var(--learn);background:var(--learn-soft)}
.st-due{color:var(--due);background:var(--due-soft)} .st-later{color:var(--ink2);background:var(--surface2)}

/* stats */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink2);line-height:1.3;display:block}
.sbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.sbox h3{margin:0;font-size:14.5px;font-weight:600}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:12px 0 10px;background:var(--surface2)}
.sbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
.fc{display:flex;align-items:stretch;gap:4px;height:118px;margin-top:12px}
.fc>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.fc .bw{flex:1;width:100%;display:flex;align-items:flex-end}
.fc .bw i{display:block;width:100%;background:var(--due);border-radius:4px 4px 1px 1px;min-height:2px}
.fc small{font-size:10.5px;color:var(--ink3)}
.fc em{font-style:normal;font-size:10.5px;color:var(--ink2);font-variant-numeric:tabular-nums;min-height:14px}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:12px}
.hm i{display:block;aspect-ratio:1;border-radius:3px;background:var(--h0)}
.hm .l1{background:var(--h1)} .hm .l2{background:var(--h2)} .hm .l3{background:var(--h3)} .hm .l4{background:var(--h4)}
.hm .fut{visibility:hidden}
.hm .tdy{box-shadow:0 0 0 1.5px var(--ink2)}

/* full screens */
.bar{display:flex;align-items:center;gap:6px;padding:8px 10px;min-height:56px;flex:none}
.bar-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25;padding:0 4px}
.bar-title b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title small{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vpwrap{flex:1;min-height:0;position:relative;display:flex}
.vp{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}
.vpin{min-width:100%;min-height:100%;display:flex;padding:12px}
.stage{position:relative;margin:auto;flex:none;touch-action:pan-x pan-y;background:#fff;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.stage img{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;pointer-events:none;border-radius:6px}
.stage.draw{touch-action:none;cursor:crosshair}
.noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#56645E;font-size:14px}
.masks{position:absolute;inset:0}
.zoomctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoomctl .ibtn{box-shadow:0 2px 8px rgba(0,0,0,.14)}
/* editor: two compact rows under the photo; photo switcher in the header */
.bar-sp{flex:1}
.hnav{flex:none;display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;height:40px;padding:0 1px}
.hnav .ibtn{width:38px;height:38px;border-radius:11px}
.hnav .ibtn:disabled{opacity:.3}
.hnav-n{min-width:40px;text-align:center;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2);user-select:none;-webkit-user-select:none}
.editor .bar-title,.practice .bar-title{flex:0 1 auto}
.editor .insp{display:flex;flex-direction:column;gap:8px}
.editor .insp-row{flex-wrap:nowrap;align-items:center}
.editor .insp-row .btn{flex:0 0 auto;min-height:44px}
.editor .insp-row .btn.ico{flex:0 0 44px;width:44px}
.editor .insp-row .btn.done{min-width:110px}
.editor .insp-row.r1{min-height:48px}
.editor .insp-row.r2{min-height:44px}
.editor .term-wrap{flex:1;min-width:0}
.editor .insp input{margin:0;height:48px}
.editor .term-wrap.has-chip input{padding-right:84px}
.tchip{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:4px;border:none;border-radius:20px;padding:5px 9px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:600;max-width:90px}
.tchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tchip .ts{display:none}
@media (max-width:560px){.tchip .tl{display:none}.tchip .ts{display:inline}.editor .term-wrap.has-chip input{padding-right:58px}.editor .bar-title b,.practice .bar-title b{display:none}.editor .bar-title small,.practice .bar-title small{font-size:12px;overflow:visible}.editor .bar-title,.practice .bar-title{flex:0 0 auto;padding:0 2px}.editor .bar,.practice .bar{gap:2px;padding:8px 6px}}
.editor .term-wrap.reading .tchip{right:40px}
.editor .term-wrap .spin{top:17px}
.hint-wrap{position:relative;flex:1;min-width:0}
.editor .insp .hint-in{height:44px;font-size:16px;padding-right:46px}
.hint-ai{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;border-radius:10px;background:transparent;color:var(--primary);display:flex;align-items:center;justify-content:center}
.hint-ai.wait .i{animation:sp 1s linear infinite}
.hint-ai:disabled{opacity:.6}
.ed-tip{flex:1;font-size:12.5px;line-height:1.35;color:var(--ink2);text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.editor .linkbar{justify-content:space-between}
.editor .linkbar b{display:flex;align-items:center;gap:8px;font-size:15px}
.editor .tools .seg{min-height:48px}
@media (max-width:560px){.editor .insp-row.r2 .btn span{display:none}.editor .insp-row.r2 .btn{width:44px;padding:0;justify-content:center}.editor .insp-row .btn.done{min-width:0;padding:0 14px}}
.editor .zoomctl,.practice .zoomctl{gap:0;border-radius:12px;background:rgba(255,255,255,.55);background:color-mix(in srgb,var(--surface) 55%,transparent);border:1px solid color-mix(in srgb,var(--line) 60%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.editor .zoomctl .ibtn,.practice .zoomctl .ibtn{width:36px;height:36px;border:none;background:transparent;box-shadow:none}
.panel{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:12px 14px 14px}
.panel-in{max-width:640px;margin:0 auto}
.study .panel-in{min-height:150px;display:flex;flex-direction:column;justify-content:flex-end}
/* keep buttons clear of the iPad/iPhone home indicator */
@media (pointer:coarse){.panel{padding-bottom:calc(44px + env(safe-area-inset-bottom,0px))}.page{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}}

/* text cards */
.tstage{flex:1;min-height:0;overflow:auto;display:flex;padding:16px;-webkit-overflow-scrolling:touch}
.tcard{margin:auto;width:100%;max-width:640px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.tq-label{font-size:11.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3)}
.tq{font-size:20px;line-height:1.4;font-weight:500;text-wrap:balance;overflow-wrap:anywhere}
.tq.latin{font-size:26px;font-weight:600;line-height:1.25}
.ta-sep{height:1px;background:var(--line);margin:8px 0 4px}
.ta{font-size:18px;line-height:1.45;overflow-wrap:anywhere}
.ta.latin{font-size:25px;font-weight:600;line-height:1.25;color:var(--ok)}
.tref{margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tref-in{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:#fff;max-width:100%}
.tref-in img{display:block;width:100%;height:100%;object-fit:contain}
.tref-box{position:absolute;border-radius:3px;box-shadow:0 0 0 2.5px #2A8749,0 0 0 6px rgba(42,135,73,.22)}
.tref-cap{font-size:12px;color:var(--ink3)}
.opts.one{grid-template-columns:1fr}
.opts.one .opt{min-height:48px}
.trow .tcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.trow .tcol .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tb{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlink{color:var(--ink3);display:inline-flex}
.trow-btns{display:flex;gap:8px;margin-bottom:10px}
.trow-btns .btn{flex:1}
.tdemo{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 14px;text-align:center}
.tdemo .latin{font-size:19px;font-weight:600}
.tdemo i{display:block;width:44px;height:2px;background:var(--line)}
.tdemo span:last-child{font-size:14px;color:var(--ink2)}

/* masks */
.mk{position:absolute;border-radius:3px;background:var(--mask);box-shadow:inset 0 0 0 1.5px var(--mask-edge);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.mk.tgt{background:var(--target);box-shadow:inset 0 0 0 1.5px var(--target-edge),0 0 0 3px rgba(225,84,58,.3);color:#fff;font-weight:700;font-size:13px;animation:mkIn .42s cubic-bezier(.34,1.56,.64,1) both,tg 1.8s .42s ease-in-out infinite}
@keyframes tg{50%{box-shadow:inset 0 0 0 1.5px var(--target-edge),0 0 0 7px rgba(225,84,58,.1)}}
.mk.open{background:transparent;box-shadow:inset 0 0 0 2.5px #2A8749,0 0 0 3px rgba(42,135,73,.25);animation:mkOpen .55s cubic-bezier(.2,.9,.25,1)}
.mk.peek{background:transparent;box-shadow:inset 0 0 0 1.5px var(--mask-edge)}
.mk.wrong{background:transparent;box-shadow:inset 0 0 0 2.5px #CC4430,0 0 0 3px rgba(204,68,48,.25);animation:shake .45s}
@media (prefers-reduced-motion:reduce){.mk.tgt{animation:none}}
.em{position:absolute;border-radius:3px;background:var(--mask);opacity:.8;box-shadow:inset 0 0 0 1.5px var(--mask-edge);touch-action:none;cursor:move}
.em .ml{position:absolute;left:3px;right:3px;top:50%;transform:translateY(-50%);font:italic 600 11px/1.15 'Source Serif 4',Georgia,serif;color:#3B2A05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.em.sel{opacity:.9;box-shadow:inset 0 0 0 2px #2C6BD1,0 0 0 3px rgba(44,107,209,.35)}
.em.sel.unnamed{opacity:1;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2.5px #2C6BD1,0 0 0 3px rgba(44,107,209,.5)}
.em .hd{position:absolute;right:-14px;bottom:-14px;width:28px;height:28px;border-radius:50%;background:#2C6BD1;border:3px solid #fff;touch-action:none;cursor:nwse-resize;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.draft{position:absolute;border:2px dashed #2C6BD1;background:rgba(44,107,209,.14);border-radius:3px;pointer-events:none}
/* arrows (photos of models without printed labels) */
.arws{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.arw{--ac:#D98A0B}
.arw .aln{stroke:var(--ac);stroke-linecap:round;fill:none}
.arw .ahd{fill:var(--ac)}
.arw .ahalo{stroke:#fff;fill:#fff;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.arw .ahit{stroke:transparent;fill:none;stroke-linecap:round}
.arw .aglow{stroke:var(--ac);fill:none;stroke-linecap:round;opacity:.22;animation:arGlow 1.8s ease-in-out infinite}
@keyframes arGlow{50%{opacity:.05}}
.editor .arw .ahit,.practice .arw .ahit,.arw.pick .ahit{pointer-events:stroke;cursor:pointer}
.arw.sel{--ac:#2C6BD1}
.arw.tgt{--ac:#E1543A}
.arw.open{--ac:#2A8749}
.arw.wrong{--ac:#CC4430}
.arw.neutral{--ac:#23403A}
.arw.new .aln,.arw.new line.ahalo{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:arDraw .38s cubic-bezier(.3,.8,.3,1) forwards}
.arw.new .ahd,.arw.new polygon.ahalo{animation:fadeIn .22s .3s ease backwards}
@keyframes arDraw{to{stroke-dashoffset:0}}
.adraft{position:absolute;inset:0;pointer-events:none;opacity:.85}
.alab{position:absolute;transform:translate(9px,-50%);font:italic 600 12px/1.2 'Source Serif 4',Georgia,serif;color:#1C2A26;background:rgba(255,255,255,.9);padding:2px 7px;border-radius:7px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.alab.l{transform:translate(calc(-100% - 9px),-50%)}
.alab.up{transform:translate(-14px,calc(-100% - 10px))}.alab.up.rt{transform:translate(calc(-100% + 14px),calc(-100% - 10px))}
.alab.dn{transform:translate(-14px,10px)}.alab.dn.rt{transform:translate(calc(-100% + 14px),10px)}
.ahdl{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;touch-action:none;cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.ahdl.tail{background:#2C6BD1;border:3px solid #fff}
.ahdl.tip{width:34px;height:34px;margin:-17px 0 0 -17px;background:rgba(44,107,209,.12);border:3px solid #2C6BD1;box-shadow:0 0 0 2px #fff,0 1px 4px rgba(0,0,0,.3)}
.tools .seg button{padding:0 6px;gap:5px}
@media (max-width:430px){.tools .seg button .i{display:none}}

/* study */
.scounts{flex:1;display:flex;justify-content:center;gap:16px;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.scounts .cur{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.ask-q{font-size:14px;color:var(--ink2);text-align:center;margin-bottom:10px}
.ans{text-align:center;margin:0 0 12px}
.ans .latin{font-size:24px;font-weight:600;line-height:1.25}
.ans .sub{font-size:13.5px;color:var(--ink2)}
.find-t{font-size:25px;font-weight:600;text-align:center;line-height:1.25;margin-bottom:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:16px;text-align:left;min-height:54px;line-height:1.25}
.typein{display:flex;gap:8px}
.typein input{flex:1;min-width:0;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:0 14px;font:italic 500 19px 'Source Serif 4',Georgia,serif}
.verdict{font-size:14px;font-weight:600;text-align:center;margin-bottom:4px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)} .verdict.mid{color:var(--warn-ink)}
.diff{font:italic 500 18px/1.5 'Source Serif 4',Georgia,serif;text-align:center;margin-bottom:4px;word-break:break-word}
.diff s{color:var(--bad);text-decoration-thickness:1.5px}
.diff mark{color:var(--ink);background:var(--warn-soft);border-radius:3px;padding:0 1px}
.hintline{font:italic 500 16px/1.35 'Source Serif 4',Georgia,serif;color:var(--ink3);text-align:center;margin:-4px 0 10px}
.hintline b{font:600 12px 'Onest',system-ui,sans-serif;color:var(--ink3);font-style:normal;letter-spacing:.3px;margin-right:6px}
.typein input::placeholder{color:var(--ink3);opacity:.75}
.insp .hint-in{font-size:16px;height:44px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.stepper span{flex:1;line-height:1.35}
.stepper div{display:flex;align-items:center;gap:6px}
.stepper b{min-width:26px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.fallback{font-size:12.5px;color:var(--ink2);text-align:center;margin-bottom:8px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate.two{grid-template-columns:1fr 1fr}
.rate button{display:flex;flex-direction:column;align-items:center;gap:1px;border:none;border-radius:12px;padding:8px 4px 10px;font-weight:600;font-size:14.5px;min-height:56px;justify-content:center}
.rate small{font-size:12px;font-weight:500;opacity:.85;font-variant-numeric:tabular-nums}
.rate .r1{background:var(--bad-soft);color:var(--bad)} .rate .r2{background:var(--warn-soft);color:var(--warn-ink)}
.rate .r3{background:var(--easy-soft);color:var(--easy)} .rate .r4{background:var(--ok-soft);color:var(--ok)}
.rate button.sug{box-shadow:0 0 0 2px currentColor}
.hint{font-size:12.5px;color:var(--ink2);margin-top:8px;text-align:center;line-height:1.4}
.donebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px}
.donebox h2{margin:8px 0 0;font-size:22px}
.donebox p{margin:0;max-width:340px}
.done-mark{width:64px;height:40px;border-radius:6px;box-shadow:inset 0 0 0 3px var(--ok);display:flex;align-items:center;justify-content:center;color:var(--ok)}
.done-btns{display:flex;flex-direction:column;gap:8px;margin-top:16px;min-width:240px}

/* editor */
.tools{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;flex:1}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:none;background:none;border-radius:9px;min-height:40px;font-weight:600;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.insp input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:0 14px;font:italic 500 19px 'Source Serif 4',Georgia,serif;margin-bottom:10px}
.insp input::placeholder{font:500 15px 'Onest',system-ui,sans-serif;color:var(--ink3)}
.insp-row{display:flex;gap:8px}
.insp-row{flex-wrap:wrap}
.insp-row .btn{flex:1 1 auto;min-width:0;padding:0 12px}
.insp-row .btn.ico{flex:0 0 48px;padding:0}
.pr-last{text-align:center;min-height:34px;margin-bottom:10px;font-size:22px;font-weight:600}
.pr-last .muted{font-size:14px;font-weight:400}

/* crop */
.crop{background:#0F1412;color:#EEF2F0;max-width:none}
.crop .ibtn{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
.crop .bar-title small{color:#9DAAA5}
.cropvp{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:24px;touch-action:none;overflow:hidden}
.cropbox{position:relative;flex:none}
.cropbox canvas{display:block;width:100%;height:100%}
.crect{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.6);outline:2px solid #fff;cursor:move;touch-action:none}
.crect::before,.crect::after{content:'';position:absolute;pointer-events:none}
.crect::before{left:33.33%;right:33.33%;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.35);border-right:1px solid rgba(255,255,255,.35)}
.crect::after{top:33.33%;bottom:33.33%;left:0;right:0;border-top:1px solid rgba(255,255,255,.35);border-bottom:1px solid rgba(255,255,255,.35)}
.ch{position:absolute;width:32px;height:32px;touch-action:none;z-index:1}
.ch::after{content:'';position:absolute;width:22px;height:22px;border:3.5px solid #fff}
.ch.tl{left:-6px;top:-6px;cursor:nwse-resize} .ch.tl::after{left:0;top:0;border-right:none;border-bottom:none}
.ch.tr{right:-6px;top:-6px;cursor:nesw-resize} .ch.tr::after{right:0;top:0;border-left:none;border-bottom:none}
.ch.bl{left:-6px;bottom:-6px;cursor:nesw-resize} .ch.bl::after{left:0;bottom:0;border-right:none;border-top:none}
.ch.br{right:-6px;bottom:-6px;cursor:nwse-resize} .ch.br::after{right:0;bottom:0;border-left:none;border-top:none}
.crop .panel{background:#161C1A;border-top-color:#26302C}
.crop-actions{display:flex;gap:8px;justify-content:center}
.crop-actions .btn{background:rgba(255,255,255,.1);color:#fff;flex:1;max-width:200px}

/* overlays */
#layer .ov{position:fixed;inset:0;z-index:100;background:rgba(12,18,16,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#layer .ov.in{opacity:1}
.sheet{width:100%;max-width:520px;max-height:88%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .42s cubic-bezier(.2,1.1,.3,1)}
.ov.in .sheet{transform:none}
@media (min-width:640px){#layer .ov{align-items:center;padding:24px}.sheet{border-radius:20px;padding-bottom:10px;transform:translateY(24px) scale(.94);opacity:0;transition:transform .38s cubic-bezier(.34,1.4,.64,1),opacity .2s}.ov.in .sheet{opacity:1}}
.stitle{padding:10px 12px 4px;font-size:13px;color:var(--ink2)}
.sitem{display:flex;align-items:center;gap:12px;width:100%;padding:13px 12px;border:none;background:none;border-radius:12px;font-size:16px;text-align:left}
.sitem>span:first-of-type{flex:1}
.sitem:hover{background:var(--surface2)}
.sitem.danger{color:var(--bad)}
.sitem.on{color:var(--primary);font-weight:600}
.sitem.cancel{justify-content:center;color:var(--ink2);font-weight:600;margin-top:4px}
.sitem small{display:block;font-size:12.5px;color:var(--ink2);font-weight:400}
.dlg{padding:14px 10px 4px}
.dlg h3{margin:0 0 6px;font-size:18px}
.dlg p{margin:0 0 14px;color:var(--ink2)}
.dlg input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:0 14px;font:inherit;font-size:16px;margin-bottom:14px}
.dlg-btns{display:flex;gap:8px}
.dlg-btns .btn{flex:1}
.dlg-btns .btn.ico{flex:0 0 48px;padding:0}
.dlg textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px;line-height:1.4;margin-bottom:10px;resize:vertical;display:block}
.fl{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:0 0 4px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 12px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--primary)}
.tprev-head{font-size:13px;color:var(--ink2);margin:0 0 6px}
.tprev-empty{font-size:13px;color:var(--ink3);margin:0 0 12px}
.tprev{max-height:30vh;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:var(--surface)}
.tprev .pr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.35}
.tprev .pr:last-child{border-bottom:none}
.tprev .pr .latin{font-size:14.5px}
.nref{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.nref img{width:64px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.nref-t{font-size:13px;flex:1;min-width:120px}
.ppgroup{font-size:13px;font-weight:600;color:var(--ink2);padding:10px 4px 2px}
button.ppitem{padding:0;background:none;text-align:left}
.platepick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;padding:6px 2px 10px;max-height:52vh;overflow:auto}
.ppitem{position:relative;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:2px solid transparent;cursor:pointer}
.ppitem.on{border-color:var(--primary)}
.ppitem input{position:absolute;top:6px;right:6px;width:20px;height:20px;z-index:1}
.ppimg{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;background:var(--surface2);color:var(--ink3);overflow:hidden}
.ppimg img{width:100%;height:100%;object-fit:cover;display:block}
.ppname{font-size:12px;color:var(--ink2);padding:4px 6px;text-align:center}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:300;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,440px);text-align:center;transition:opacity .3s,transform .3s;pointer-events:none;animation:toastIn .5s cubic-bezier(.34,1.56,.64,1) both;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.toast.out{opacity:0;transform:translate(-50%,-12px) scale(.96)}
.busy{position:fixed;inset:0;z-index:200;background:rgba(12,18,16,.42);display:flex;align-items:center;justify-content:center;padding:24px}
.busy-in{background:var(--surface);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:220px;text-align:center}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--primary);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- motion ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideInR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes slideInL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes popSoft{0%{opacity:0;transform:translateY(10px) scale(.92)}70%{opacity:1;transform:translateY(-2px) scale(1.02)}100%{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes cardIn{from{opacity:0;transform:translateX(46px) rotate(2.5deg) scale(.95)}to{opacity:1;transform:none}}
@keyframes mkIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes mkOpen{0%{box-shadow:inset 0 0 0 2.5px #2A8749,0 0 0 0 rgba(42,135,73,.55)}60%{box-shadow:inset 0 0 0 2.5px #2A8749,0 0 0 14px rgba(42,135,73,0)}100%{box-shadow:inset 0 0 0 2.5px #2A8749,0 0 0 3px rgba(42,135,73,.25)}}
@keyframes emPop{0%{opacity:0;transform:scale(.3) translateY(-10px)}70%{transform:scale(1.08)}100%{transform:none}}
@keyframes tabBump{0%{transform:scale(1)}35%{transform:scale(.8) translateY(2px)}70%{transform:scale(1.18) translateY(-2px)}100%{transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-24px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes drawCheck{to{stroke-dashoffset:0}}
@keyframes ring{0%{box-shadow:inset 0 0 0 3px var(--ok),0 0 0 0 rgba(42,135,73,.45)}100%{box-shadow:inset 0 0 0 3px var(--ok),0 0 0 22px rgba(42,135,73,0)}}
@keyframes ringSug{0%{box-shadow:0 0 0 2px currentColor,0 0 0 2px rgba(60,90,120,.3)}100%{box-shadow:0 0 0 2px currentColor,0 0 0 14px rgba(60,90,120,0)}}
@keyframes conf{0%{transform:translate(0,0) rotate(0) scale(.3);opacity:1}40%{transform:translate(var(--x),var(--y)) rotate(calc(var(--r)*.5)) scale(1);opacity:1}100%{transform:translate(calc(var(--x)*1.25),var(--y2)) rotate(var(--r)) scale(.9);opacity:0}}
@keyframes fxUp{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}25%{opacity:1;transform:translate(-50%,-10px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-58px) scale(1)}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes sepGrow{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}

/* screen entrances (only on navigation) */
#app.enter-fwd>.page>*{animation:slideInR .46s cubic-bezier(.2,.9,.25,1) backwards}
#app.enter-back>.page>*{animation:slideInL .46s cubic-bezier(.2,.9,.25,1) backwards}
#app.enter-tab>.page>*{animation:fadeUp .48s cubic-bezier(.2,.9,.25,1) backwards}
#app[class^="enter"]>.page>*:nth-child(2){animation-delay:.04s}
#app[class^="enter"]>.page>*:nth-child(3){animation-delay:.08s}
#app[class^="enter"]>.page>*:nth-child(4){animation-delay:.12s}
#app[class^="enter"]>.page>*:nth-child(5){animation-delay:.16s}
#app[class^="enter"]>.page>*:nth-child(6){animation-delay:.2s}
#app[class^="enter"]>.page>*:nth-child(7){animation-delay:.24s}
#app[class^="enter"]>.page>*:nth-child(8){animation-delay:.28s}
#app[class^="enter"]>.page>*:nth-child(9){animation-delay:.32s}
#app[class^="enter"]>.page>*:nth-child(10){animation-delay:.36s}
#app[class^="enter"]>.page>*:nth-child(n+11){animation-delay:.4s}
#app[class^="enter"]>.full{animation:fadeIn .32s ease backwards}
#app[class^="enter"] .stattile{animation:popSoft .55s cubic-bezier(.34,1.56,.64,1) backwards}
#app[class^="enter"] .stattile:nth-child(2){animation-delay:.07s}
#app[class^="enter"] .stattile:nth-child(3){animation-delay:.14s}
#app[class^="enter"] .modes .mode{animation:popSoft .5s cubic-bezier(.34,1.56,.64,1) backwards}
#app[class^="enter"] .modes .mode:nth-child(2){animation-delay:.04s}
#app[class^="enter"] .modes .mode:nth-child(3){animation-delay:.08s}
#app[class^="enter"] .modes .mode:nth-child(4){animation-delay:.12s}
#app[class^="enter"] .modes .mode:nth-child(5){animation-delay:.16s}
#app[class^="enter"] .modes .mode:nth-child(6){animation-delay:.2s}
#app[class^="enter"] .dprog i{transform-origin:left;animation:grow .9s .2s cubic-bezier(.2,.9,.25,1) backwards}
#app[class^="enter"] .sbar{transform-origin:left;animation:grow .8s .15s cubic-bezier(.2,.9,.25,1) backwards}
#app[class^="enter"] .fc .bw i{transform-origin:bottom;animation:fcGrow .7s cubic-bezier(.34,1.3,.64,1) backwards}
@keyframes fcGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#app[class^="enter"] .hm{animation:fadeIn .8s .2s ease backwards}
#app[class^="enter"] .tile{animation:popSoft .5s cubic-bezier(.34,1.56,.64,1) backwards}
#app[class^="enter"] .tile:nth-child(2){animation-delay:.05s}
#app[class^="enter"] .tile:nth-child(3){animation-delay:.1s}
#app[class^="enter"] .tile:nth-child(4){animation-delay:.15s}
#app[class^="enter"] .tile:nth-child(n+5){animation-delay:.2s}
.btn.primary.big{background-image:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.16) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 3.2s 1s ease-in-out infinite}
@media (hover:hover){.deck:hover,.tile:hover,.mode:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,40,34,.1)}}

/* sheets: items cascade in */
.ov.in .sitem,.ov.in .dlg>*,.ov.in .ppitem{animation:fadeUp .34s cubic-bezier(.2,.9,.25,1) backwards}
.ov.in .sitem:nth-child(2),.ov.in .dlg>*:nth-child(2){animation-delay:.03s}
.ov.in .sitem:nth-child(3),.ov.in .dlg>*:nth-child(3){animation-delay:.06s}
.ov.in .sitem:nth-child(4),.ov.in .dlg>*:nth-child(4){animation-delay:.09s}
.ov.in .sitem:nth-child(5),.ov.in .dlg>*:nth-child(5){animation-delay:.12s}
.ov.in .sitem:nth-child(n+6),.ov.in .dlg>*:nth-child(n+6){animation-delay:.15s}

/* study */
.tcard.tc-in{animation:cardIn .45s cubic-bezier(.2,.9,.25,1) backwards}
.ta-sep{transform-origin:left;animation:sepGrow .4s cubic-bezier(.2,.9,.25,1) backwards}
.ta{animation:fadeUp .4s .06s cubic-bezier(.2,.9,.25,1) backwards}
.tref{animation:fadeUp .45s .14s cubic-bezier(.2,.9,.25,1) backwards}
.tref-box{animation:mkOpen .8s .45s cubic-bezier(.2,.9,.25,1) backwards}
#panel>*{animation:fadeUp .32s cubic-bezier(.2,.9,.25,1) backwards}
#panel .opts .opt{animation:popSoft .4s cubic-bezier(.34,1.56,.64,1) backwards}
#panel .opts .opt:nth-child(2){animation-delay:.05s}
#panel .opts .opt:nth-child(3){animation-delay:.1s}
#panel .opts .opt:nth-child(4){animation-delay:.15s}
#panel .rate button{animation:popSoft .42s cubic-bezier(.34,1.56,.64,1) backwards}
#panel .rate button:nth-child(2){animation-delay:.04s}
#panel .rate button:nth-child(3){animation-delay:.08s}
#panel .rate button:nth-child(4){animation-delay:.12s}
#panel .rate button.sug{animation:popSoft .42s cubic-bezier(.34,1.56,.64,1) backwards,ringSug 1.2s .5s ease-out 2}
.verdict.ok{animation:pop .45s cubic-bezier(.34,1.56,.64,1) backwards}
.verdict.bad{animation:shake .45s backwards}
.verdict.mid{animation:fadeUp .3s backwards}
.ans .latin{display:inline-block;animation:popSoft .45s cubic-bezier(.34,1.56,.64,1) backwards}
.stage{animation:fadeIn .35s ease backwards}
.streak{display:inline-flex;align-items:center;gap:3px;padding:2px 8px 2px 6px;border-radius:20px;background:var(--warn-soft);color:var(--warn-ink);font-size:13px}
.streak.bump{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.fx{position:fixed;z-index:260;pointer-events:none;font-weight:700;font-size:16px;padding:3px 10px;border-radius:20px;animation:fxUp .85s cubic-bezier(.2,.9,.25,1) forwards;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.fx1{background:var(--bad);color:#fff}.fx2{background:#E3A21A;color:#fff}.fx3{background:var(--easy);color:#fff}.fx4{background:var(--ok);color:#fff}
.done-mark{animation:pop .6s .1s cubic-bezier(.34,1.56,.64,1) backwards,ring 1.4s .6s ease-out 2}
.done-mark svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:drawCheck .5s .45s cubic-bezier(.65,0,.35,1) forwards}
.donebox>*:not(.done-mark){animation:fadeUp .5s cubic-bezier(.2,.9,.25,1) backwards}
.donebox h2{animation-delay:.3s!important}.donebox p{animation-delay:.4s!important}.donebox .done-btns{animation-delay:.5s!important}
.confetti{position:fixed;left:50%;top:34%;width:0;height:0;pointer-events:none;z-index:250}
.confetti i{position:absolute;left:0;top:0;animation:conf 1.6s cubic-bezier(.15,.75,.35,1) backwards}

/* editor */
.em.em-pop{animation:emPop .5s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(min(var(--i),28) * 28ms)}
/* auto-read: a frame being read shimmers; status + suggestion live in the inspector */
.em.reading{opacity:1;background-image:linear-gradient(100deg,transparent 15%,rgba(255,255,255,.75) 50%,transparent 85%);background-size:260% 100%;animation:emRead 1.1s linear infinite}
@keyframes emRead{from{background-position:130% 0}to{background-position:-130% 0}}
@media (prefers-reduced-motion:reduce){.em.reading{animation:none;background-image:none;box-shadow:inset 0 0 0 2.5px var(--primary)}}
.term-wrap{position:relative}
.term-wrap .spin{position:absolute;right:14px;top:18px;display:none}
.term-wrap.reading .spin{display:block}
.term-wrap.reading input{padding-right:40px}
.editor .panel-in{position:relative}
#ocrSugg{position:absolute;left:0;right:0;bottom:100%;margin-bottom:20px;z-index:4;pointer-events:none}
@media (max-width:700px){#ocrSugg{right:52px}}
#ocrSugg .ocr-sugg{pointer-events:auto;margin:0;box-shadow:0 6px 20px rgba(0,0,0,.16);background:var(--surface);animation:popSoft .35s cubic-bezier(.34,1.56,.64,1) backwards}
.editor .panel{position:relative}
.spin.sm{width:14px;height:14px;border-width:2px;flex:none}
.grpline{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin:-4px 0 10px;min-height:36px}
.grpline span{flex:1;min-width:0;line-height:1.3}
.grpline .btn.sm{min-height:32px;padding:0 10px;font-size:13px;color:var(--primary)}
.ocr-sugg{display:flex;align-items:center;gap:8px;width:100%;margin:-4px 0 10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--primary);background:var(--primary-soft);color:var(--ink);text-align:left;font-size:13.5px}
.ocr-sugg>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocr-sugg .latin{font-size:15px}
.ocr-sugg b{flex:none;color:var(--primary);font-weight:600}
/* feature tips: a toast with a switch-in-place button */
.toast.tip{display:flex;align-items:center;gap:10px;text-align:left;pointer-events:auto;padding:9px 9px 9px 14px;width:max-content}
.tip-ic{flex:none;display:flex;opacity:.7}
.tip-t{flex:1;min-width:0;line-height:1.35}
.tip-b{flex:none;border:none;border-radius:9px;padding:8px 11px;background:rgba(255,255,255,.18);background:color-mix(in srgb,var(--surface) 20%,transparent);color:inherit;font-weight:600;font-size:13px;white-space:nowrap}
.tip-b:active{transform:scale(.95)}
.mode.on .i{animation:tabBump .5s cubic-bezier(.34,1.56,.64,1)}

/* ---------- ask panel (Claude) ---------- */
#chat{position:fixed;z-index:90;right:0;top:0;bottom:0;width:min(400px,40vw);display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.08);transform:translateX(104%);transition:transform .34s cubic-bezier(.2,.9,.25,1);visibility:hidden}
#chat.on{transform:none;visibility:visible}
@media (min-width:900px){body.chat-open #app{margin-right:min(400px,40vw);transition:margin .34s cubic-bezier(.2,.9,.25,1)}}
@media (max-width:899px){#chat{top:auto;left:0;width:auto;height:64%;border-left:none;border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -12px 32px rgba(0,0,0,.14);transform:translateY(104%);height:56%}}
.ch-head{display:flex;align-items:center;gap:6px;padding:10px 10px 8px 14px;border-bottom:1px solid var(--line);flex:none}
.ch-head b{flex:1;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.ch-ctx{font-size:12.5px;color:var(--ink2);padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--line);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-ctx .latin{color:var(--ink)}
.ch-log{flex:1;min-height:0;overflow:auto;padding:12px 12px 4px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ch-msg{max-width:92%;padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.ch-msg.u{align-self:flex-end;background:var(--primary);color:var(--primary-ink);border-bottom-right-radius:4px}
.ch-msg.a{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.ch-msg.a.wait{color:var(--ink3)}
.ch-msg.err{align-self:center;background:var(--bad-soft);color:var(--bad);font-size:13.5px}
.ch-empty{margin:auto 0;text-align:center;color:var(--ink2);font-size:14px;line-height:1.5;padding:10px}
.ch-chips{display:flex;gap:6px;overflow-x:auto;padding:6px 12px 2px;flex:none;scrollbar-width:none}
.ch-chips::-webkit-scrollbar{display:none}
.ch-chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 11px;font-size:13px;color:var(--ink);white-space:nowrap}
.ch-form{display:flex;gap:8px;align-items:flex-end;padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px));flex:none}
@media (pointer:coarse){.ch-form{padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}}
.ch-form textarea{flex:1;min-width:0;max-height:120px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px;line-height:1.35;resize:none}
.ch-form .ibtn{background:var(--primary);color:var(--primary-ink);border-color:transparent;width:44px;height:44px}
.ch-form .ibtn.stop{background:var(--surface2);color:var(--ink)}
/* ---------- comfort: paper theme, text size, calm mode ---------- */
:root[data-theme="paper"]{--bg:#EFE7D6;--surface:#FBF6EB;--surface2:#F3EBDA;--ink:#2B2419;--ink2:#6B5F4D;--ink3:#9C8F7A;--line:#E0D4BD;--primary:#6B4F2A;--primary-ink:#FFF9EE;--primary-soft:#EDE0C8;--h0:#E9E0CC}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"],:root[data-theme="paper"]{color-scheme:light}
:root{--fs:1}
body{font-size:calc(15px*var(--fs))}
.ask-q{font-size:calc(14px*var(--fs))}
.ans .latin{font-size:calc(24px*var(--fs))}
.ans .sub{font-size:calc(13.5px*var(--fs))}
.find-t{font-size:calc(25px*var(--fs))}
.opt{font-size:calc(16px*var(--fs))}
.typein input{font-size:calc(19px*var(--fs))}
.verdict{font-size:calc(14px*var(--fs))}
.diff{font-size:calc(18px*var(--fs))}
.hintline{font-size:calc(16px*var(--fs))}
.tq{font-size:calc(20px*var(--fs))}
.tq.latin{font-size:calc(26px*var(--fs))}
.ta{font-size:calc(18px*var(--fs))}
.ta.latin{font-size:calc(25px*var(--fs))}
.rate button{font-size:calc(14.5px*var(--fs))}
.rate small{font-size:calc(12px*var(--fs))}
.ch-msg{font-size:calc(15px*var(--fs))}
.crow .t,.dname,.sitem{font-size:calc(16px*var(--fs))}
.dmeta,.hint{font-size:calc(13px*var(--fs))}
html.calm *,html.calm *::before,html.calm *::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
html.calm .btn,html.calm .ibtn,html.calm .mode,html.calm .deck,html.calm .tile,html.calm .opt,html.calm .rate button,html.calm .sitem,html.calm .crow{transition-timing-function:ease!important}
html.calm .btn.primary.big{background-image:none}
html.calm .deck:hover,html.calm .tile:hover,html.calm .mode:hover{transform:none}
/* settings rows */
.segrow{display:flex;align-items:center;gap:12px;padding:8px 0;flex-wrap:wrap}
.segrow>span{flex:1;min-width:120px}
.segrow .seg{flex:0 1 auto}
.segrow .seg button{padding:0 12px;min-height:36px}
.swrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border:none;background:none;text-align:left;border-top:1px solid var(--line)}
.swrow>span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.swrow b{font-weight:600}
.swrow small{font-size:12.5px;color:var(--ink2);line-height:1.35}
.sw{flex:none;position:relative;width:46px;height:28px;border-radius:14px;background:var(--line);transition:background .2s}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--primary)}
.sw.on::after{transform:translateX(18px)}
/* keyboard hints on rating buttons */
.kb{display:none}
@media (hover:hover) and (pointer:fine){.kb{display:inline-block;font-style:normal;font-size:11px;opacity:.6;margin-left:4px}}
/* auto-advance after a correct answer */
.rate button.auto{position:relative;overflow:hidden}
.rate button.auto::after{content:'';position:absolute;left:0;bottom:0;height:4px;width:0;background:currentColor;opacity:.55;animation:autoFill 1.5s linear forwards}
html.calm .rate button.auto::after{animation-duration:1.5s!important}
@keyframes autoFill{to{width:100%}}
.autohint{font-size:12.5px;color:var(--ink2);text-align:center;margin-top:8px}
/* swipe feedback */
.swpill{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%) scale(.9);z-index:80;padding:6px 16px;border-radius:20px;font-weight:700;font-size:16px;color:#fff;opacity:0;pointer-events:none;transition:opacity .12s,transform .12s;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.swpill.on{opacity:1;transform:translateX(-50%) scale(1)}
.swpill.r1{background:var(--bad)}.swpill.r2{background:#E3A21A}.swpill.r3{background:var(--easy)}.swpill.r4{background:var(--ok)}.swpill.r0{background:var(--ink2)}
.swmove{transition:none!important}
.swback{transition:transform .25s cubic-bezier(.2,.9,.25,1)!important}
/* landscape: answer panel becomes a right-hand column */
#app.wide .full.study{display:grid;grid-template-columns:minmax(0,1fr) clamp(280px,28vw,360px);grid-template-rows:auto minmax(0,1fr)}
#app.wide .full.study>.bar{grid-column:1/-1}
#app.wide .full.study>.vpwrap,#app.wide .full.study>.tstage{grid-column:1;grid-row:2;min-height:0}
#app.wide .full.study>.panel{grid-column:2;grid-row:2;border-top:none;border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:auto;min-height:0}
#app.wide .study .panel-in{flex:1;width:100%;max-width:none;min-height:0;justify-content:flex-end}
#app.wide .rate,#app.wide .rate.two{grid-template-columns:1fr;gap:10px}
#app.wide .rate button{flex-direction:row-reverse;justify-content:space-between;padding:0 18px;min-height:60px;font-size:calc(16px*var(--fs))}
#app.wide .rate button small{display:flex;align-items:center;gap:4px}
#app.wide .opts{grid-template-columns:1fr}
#app.wide .typein{flex-direction:column}
#app.wide .typein .btn{min-height:48px}
/* ---------- session length, exam plan, pronunciation ---------- */
.sesslim{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 2px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.sesslim button{border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600}
.sesslim button.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.examline{display:flex;align-items:center;gap:8px;background:var(--new-soft);color:var(--new);border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:600;margin:0 0 12px;width:100%;border:none;text-align:left}
.examline span{flex:1}
.examline small{font-weight:500;opacity:.85}
.examline.over{background:var(--surface2);color:var(--ink2)}
.limtag{font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--surface2);border-radius:20px;padding:2px 9px}
.spk{border:none;background:none;color:var(--ink3);padding:4px 6px;margin-left:2px;border-radius:8px;vertical-align:middle;display:inline-flex}
.spk:active{color:var(--primary)}
.dlg input[type=date]{font:inherit;font-size:16px}
.plan-prev{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;margin:0 0 14px;color:var(--ink)}
/* ---------- hard cards, mnemonics, see-through neighbours ---------- */
.st-leech{color:var(--bad);background:var(--bad-soft)}
.mk.ghost{opacity:.5}
.hardlist{margin-top:10px}
.hardlist .crow{padding:9px 4px;border-bottom:1px solid var(--line)}
.hardlist .crow:last-child{border-bottom:none}
.hardlist .cnt{font-size:12.5px;color:var(--bad);font-weight:600;flex:none}
.hintai{display:flex;align-items:center;gap:6px;border:none;background:none;color:var(--primary);font-weight:600;font-size:13.5px;padding:0 2px 10px;margin-top:-4px}
.hintai:disabled{opacity:.5}
.hvars{display:flex;flex-direction:column;gap:6px;margin:-2px 0 10px}
.hvars:empty{display:none}
.hvar{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:9px 12px;font-size:14.5px;line-height:1.4;color:var(--ink)}
.hvar.on{border-color:var(--primary);background:var(--primary-soft)}
/* ---------- linked frames ---------- */
.em.ex{opacity:.62;box-shadow:inset 0 0 0 1.5px var(--mask-edge);background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.35) 6px 9px)}
.em.ex.sel{opacity:.85;box-shadow:inset 0 0 0 2px #2C6BD1,0 0 0 2px rgba(44,107,209,.3)}
.em.linkable,.editor .stage .em:not(.sel){transition:box-shadow .15s}
.linkbar b{display:flex;align-items:center;gap:8px;font-size:15px}
/* ---------- quick settings panel (gear on every screen) ---------- */
#qsDim{position:fixed;inset:0;z-index:94;background:rgba(12,18,16,.3);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
#qsDim.on{opacity:1;visibility:visible;transition:opacity .25s}
#qs{position:fixed;z-index:95;right:0;top:0;bottom:0;width:min(440px,60vw);display:flex;flex-direction:column;background:var(--bg);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.12);transform:translateX(104%);visibility:hidden;transition:transform .34s cubic-bezier(.2,.9,.25,1),visibility 0s .34s;padding-top:env(safe-area-inset-top,0px);outline:none}
#qs.on{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.9,.25,1)}
#qs.inst,#qsDim.inst{transition:none!important}
@media (max-width:699px){#qs{top:auto;left:0;width:auto;height:88%;border-left:none;border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -12px 32px rgba(0,0,0,.16);transform:translateY(104%);padding-top:0;overflow:hidden}}
.qs-head{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.qs-head b{flex:1;min-width:0;font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.qs-head b .i{color:var(--ink2)}
.qs-body{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 12px calc(24px + env(safe-area-inset-bottom,0px))}
.qs-body .overview{margin-bottom:12px}
@media (pointer:coarse){.qs-body{padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}}
/* ---------- check against notes ---------- */
.cmp-btn{margin-top:14px}
.cmp-note{font-size:12.5px;color:var(--ink3);text-align:center;margin:6px 0 0}
.cmp-sum{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);margin:0 0 10px}
.cmp-sum b{color:var(--ink);font-size:16px}
.cmp-body{max-height:min(52vh,440px);overflow:auto;margin:0 0 10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.cmp-sec{margin:0 0 12px}
.cmp-h{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 6px}
.cmp-list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.cmp-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:15px}
label.cmp-row{cursor:pointer}
.cmp-row:last-child{border-bottom:none}
.dlg .cmp-row input{width:18px;height:18px;margin:0;flex:none;accent-color:var(--bad)}
.cmp-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-row .cp{flex:none;font-size:12px;color:var(--ink3)}
.cmp-eq{flex:none;max-width:52%;font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-miss{font-size:13.5px;line-height:1.55;color:var(--ink2)}
.cmp-ok{color:var(--ok);font-weight:600}
/* ---------- Anki cards (html) and the import picker ---------- */
.ahtml{font-size:19px;line-height:1.5;text-align:center;overflow-wrap:anywhere;color:var(--ink)}
.ahtml.aa{font-size:18px}
.ahtml img{max-width:100%;height:auto;max-height:46vh;border-radius:8px;vertical-align:middle}
.ahtml ul,.ahtml ol{display:inline-block;text-align:left;margin:6px 0;padding-left:1.4em}
.ahtml table{border-collapse:collapse;margin:8px auto;font-size:.86em;display:block;overflow-x:auto;max-width:100%;width:max-content}
.ahtml td,.ahtml th{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.ahtml .cloze{font-weight:700;color:var(--new)}
.ahtml hr{border:none;border-top:1px solid var(--line);margin:12px 0}
.ahtml p{margin:6px 0}
.ahtml h1,.ahtml h2,.ahtml h3{font-size:1.1em;margin:6px 0}
.ahtml details.ahint{margin:8px auto 0;text-align:left;background:var(--surface2);border-radius:10px;padding:6px 12px;font-size:.86em}
.ahtml details.ahint summary{cursor:pointer;color:var(--ink2);font-weight:600}
.anote{font-size:13.5px;line-height:1.4;color:var(--ink2);margin-top:4px}
.ak-file{word-break:break-word}
.ak-tree{max-height:min(42vh,360px);overflow:auto;border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--surface)}
.ak-row{display:flex;align-items:center;gap:10px;padding:9px 12px 9px calc(12px + var(--d,0) * 18px);border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px}
.ak-row:last-child{border-bottom:none}
.dlg .ak-row input{width:18px;height:18px;margin:0;accent-color:var(--primary);flex:none}
.ak-row .ak-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ak-row .ak-c{flex:none;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ak-sum{font-size:13.5px;color:var(--ink2);line-height:1.5;margin:0 0 12px}
.ak-sum b{color:var(--ink);font-weight:600}
/* ---------- share by code / QR ---------- */
.dlg.share .qr{width:min(64vw,240px);margin:2px auto 12px;padding:12px;background:#fff;border-radius:14px;border:1px solid var(--line)}
.dlg.share .qr svg{display:block;width:100%;height:auto}
.share-code{text-align:center;font-size:24px;font-weight:600;letter-spacing:.14em;font-variant-numeric:tabular-nums;margin:0 0 10px;user-select:all;-webkit-user-select:all}
.dlg.share .muted.sm{margin:0 0 14px;line-height:1.5}
.dlg .chk input{margin:0;flex:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

nk to someone else’s app: it holds its owner’s decks and progress, so you can’t study or import files here.", "Avasid lingi kellegi teise rakendusele: selles on omaniku pakid ja edenemine, seega siin õppida ega faile importida ei saa."],["Чтобы учиться со своими колодами, сделайте свою копию Corpus — она будет пустой и только вашей. Скопируйте запрос ниже и отправьте его Claude в новом чате. Потом откройте свою копию и импортируйте в неё файл колоды или папки.", "To study with your own decks, make your own copy of Corpus — it starts empty and is yours alone. Copy the request below and send it to Claude in a new chat. Then open your copy and import the deck or folder file into it.", "Oma pakkidega õppimiseks tee endale Corpuse koopia — see on tühi ja ainult sinu. Kopeeri allolev päring ja saada see Claude’ile uues vestluses. Seejärel ava oma koopia ja impordi sinna paki või kausta fail."],["Скопировать запрос", "Copy the request", "Kopeeri päring"],["Посмотреть колоды владельца", "View the owner’s decks", "Vaata omaniku pakke"],["Запрос скопирован", "Request copied", "Päring kopeeritud"],["Текст выделен — скопируйте его вручную", "Text selected — copy it manually", "Tekst on valitud — kopeeri see käsitsi"],["Аккаунт", "Account", "Konto"],["Выйти", "Sign out", "Logi välja"],["Выйти из аккаунта?", "Sign out?", "Kas logid välja?"],["Колоды и прогресс останутся в аккаунте — войдите снова, чтобы продолжить.", "Your decks and progress stay in your account — sign in again to continue.", "Pakid ja edenemine jäävad kontole — jätkamiseks logi uuesti sisse."],["Анатомия по изображениям: колоды из фото атласа и интервальные повторения.", "Anatomy from images: decks made from atlas photos, with spaced repetition.", "Anatoomia piltide järgi: pakid atlase fotodest ja vahedega kordamine."],["Вход", "Sign in", "Sisselogimine"],["Регистрация", "Sign up", "Registreerimine"],["Пароль", "Password", "Parool"],["Код приглашения", "Invite code", "Kutsekood"],["Войти", "Sign in", "Logi sisse"],["Создать аккаунт", "Create account", "Loo konto"],["Подождите…", "Please wait…", "Oota…"],["Забыли пароль? Попросите того, кто дал вам ссылку, сбросить его.", "Forgot your password? Ask the person who gave you the link to reset it.", "Unustasid parooli? Palu lingi saatjal see lähtestada."],["Аккаунт хранит ваши колоды и прогресс — они будут доступны с любого устройства.", "Your account keeps your decks and progress — available on any device.", "Konto hoiab sinu pakke ja edenemist — need on kättesaadavad igast seadmest."],["Проверьте email.", "Check the email address.", "Kontrolli e-posti aadressi."],["Пароль — минимум 6 символов.", "The password needs at least 6 characters.", "Parool peab olema vähemalt 6 märki."],["Неверный email или пароль.", "Wrong email or password.", "Vale e-post või parool."],["Такой email уже зарегистрирован — войдите.", "This email is already registered — sign in.", "See e-post on juba registreeritud — logi sisse."],["Регистрация сейчас закрыта.", "Sign-up is closed right now.", "Registreerimine on praegu suletud."],["Слишком много попыток — подождите пару минут.", "Too many attempts — wait a couple of minutes.", "Liiga palju katseid — oota paar minutit."],["Нужна ссылка-приглашение: откройте ссылку, которую вам прислали, или введите код.", "You need an invite: open the link you were sent, or enter the code.", "Vaja on kutset: ava saadetud link või sisesta kood."],["Вход требует подтверждения почты, а письма отсюда не отправляются. Попросите администратора выключить «Confirm email» в Supabase.", "Sign-in needs email confirmation, but this site sends no emails. Ask the admin to turn off “Confirm email” in Supabase.", "Sisselogimine nõuab e-posti kinnitamist, kuid siit kirju ei saadeta. Palu administraatoril Supabase’is „Confirm email“ välja lülitada."],["Нет соединения. Попробуйте ещё раз.", "No connection. Try again.", "Ühendus puudub. Proovi uuesti."],["Не получилось войти. Попробуйте ещё раз.", "Couldn’t sign in. Try again.", "Sisselogimine ebaõnnestus. Proovi uuesti."],["Сайт ещё настраивается", "The site is still being set up", "Lehte alles seadistatakse"],["Загляните чуть позже.", "Please check back a little later.", "Vaata veidi hiljem uuesti."],["Файл готов", "The file is ready", "Fail on valmis"],["Отправить…", "Send…", "Saada…"],["Сохранить на устройство", "Save to device", "Salvesta seadmesse"],["Здесь колоды и прогресс его владельца, поэтому учиться и импортировать файлы в этом окне нельзя.", "It holds its owner’s decks and progress, so you can’t study or import files in this window.", "Siin on omaniku pakid ja edenemine, seega selles aknas õppida ega faile importida ei saa."],["Corpus работает и как сайт: зарегистрируйтесь — у вас будут свои колоды и свой прогресс на любом устройстве. Файл колоды или папки, который вам прислали, импортируйте уже там.", "Corpus also works as a website: sign up there to get your own decks and progress on any device. Import the deck or folder file you received there.", "Corpus töötab ka veebilehena: registreeru seal — sul on oma pakid ja edenemine igas seadmes. Saadud paki või kausta faili impordi juba seal."],["Открыть Corpus", "Open Corpus", "Ava Corpus"],["Лимит ИИ на сегодня исчерпан — он обновится завтра.", "Today’s AI limit is used up — it resets tomorrow.", "Tänane TI limiit on täis — see uueneb homme."],["ИИ сегодня:", "AI today:", "TI täna:"],["Статистика сайта", "Site statistics", "Saidi statistika"],["Загружаю…", "Loading…", "Laadin…"],["Не удалось загрузить статистику.", "Couldn’t load the statistics.", "Statistikat ei õnnestunud laadida."],["пользователей", "users", "kasutajat"],["активны сегодня", "active today", "aktiivsed täna"],["активны за 7 дней", "active in 7 days", "aktiivsed 7 päevaga"],["ответов за 7 дней", "answers in 7 days", "vastust 7 päevaga"],["ИИ-запросов за 7 дней", "AI requests in 7 days", "TI päringut 7 päevaga"],["Активные люди по дням", "Active people by day", "Aktiivsed inimesed päevade kaupa"],["Люди", "People", "Inimesed"],["был(а)", "last seen", "viimati"],["дней за месяц:", "days this month:", "päevi kuus:"],["ответов за неделю:", "answers this week:", "vastuseid nädalas:"]];
I18N_DICT.push(["Стрелка", "Arrow", "Nool"],["Коснитесь структуры — появится стрелка. Или проведите пальцем: остриё там, где отпустите.", "Tap a structure to add an arrow, or drag: the tip lands where you let go.", "Puuduta struktuuri, et lisada nool, või lohista: noole ots jääb sinna, kus lahti lased."],["Что показывает стрелка — на латыни", "What the arrow points to — in Latin", "Millele nool näitab — ladina keeles"],["Тяните за концы, чтобы изменить стрелку, за середину — чтобы сдвинуть.", "Drag an end to reshape the arrow, or the middle to move it.", "Lohista otsast, et noolt muuta, või keskelt, et seda nihutada."],["Удалить стрелку", "Delete arrow", "Kustuta nool"],["Что показывает стрелка?", "What does the arrow point to?", "Millele nool näitab?"],["Напишите, что показывает стрелка", "Type what the arrow points to", "Kirjuta, millele nool näitab"],["Нажмите на нужную стрелку", "Tap the right arrow", "Puuduta õiget noolt"],["Нажмите на нужную рамку или стрелку", "Tap the right frame or arrow", "Puuduta õiget raami või noolt"],["Неверно — нужная стрелка отмечена зелёным", "Wrong — the right arrow is shown in green", "Vale — õige nool on märgitud roheliselt"],["Стрелку нельзя связать с рамкой", "An arrow can’t be linked to a frame", "Noolt ei saa raamiga siduda"],["Нажимайте на стрелки, чтобы проверить себя", "Tap the arrows to test yourself", "Puuduta nooli, et ennast kontrollida"],["Нажимайте на рамки и стрелки, чтобы проверить себя", "Tap the frames and arrows to test yourself", "Puuduta raame ja nooli, et ennast kontrollida"],["Алгоритм повторения", "Review algorithm", "Kordamise algoritm"],["Классический SM-2: интервал растёт на коэффициент лёгкости карточки.", "Classic SM-2: the interval grows by the card’s ease factor.", "Klassikaline SM-2: intervall kasvab kaardi kergusteguri võrra."],["FSRS — алгоритм из современного Anki. Для каждой карточки он считает, насколько прочно она запомнилась, и назначает повтор к моменту, когда вы начнёте её забывать. Обычно это меньше повторений при той же памяти.", "FSRS is the algorithm used by modern Anki. For every card it estimates how firmly you remember it and schedules the review for the moment you would start forgetting it. Usually that means fewer reviews for the same memory.", "FSRS on tänapäevase Anki algoritm. Iga kaardi puhul hindab see, kui kindlalt sa seda mäletad, ja määrab korduse hetkeks, mil hakkaksid seda unustama. Tavaliselt tähendab see sama mälu juures vähem kordusi."],["Классический SM-2", "Classic SM-2", "Klassikaline SM-2"],["Желаемое запоминание", "Desired retention", "Soovitud meeldejätmine"],["выше — надёжнее, но повторений больше", "higher is safer but means more reviews", "kõrgem on kindlam, kuid kordusi on rohkem"],["Прогресс сохраняется при переключении: уже выученные карточки продолжают со своих интервалов.", "Switching keeps your progress: cards you already know continue from their current intervals.", "Vahetamisel edenemine säilib: juba õpitud kaardid jätkavad oma praegustest intervallidest."],["Включён FSRS", "FSRS is on", "FSRS on sisse lülitatud"],["Включён классический SM-2", "Classic SM-2 is on", "Klassikaline SM-2 on sisse lülitatud"],["Алгоритм", "Algorithm", "Algoritm"]);
I18N_DICT.push(["Читаю текст в рамке…", "Reading the text in the frame…", "Loen raamis olevat teksti…"],["Прочитано:", "Read:", "Loetud:"],["Выключить", "Turn off", "Lülita välja"],["Включить", "Turn on", "Lülita sisse"],["Текст в рамке не прочитался — впишите название вручную.", "Couldn’t read the text in this frame — type the name yourself.", "Raami teksti ei õnnestunud lugeda — kirjuta nimetus ise."],["Название в рамке распознаётся само. Выключить можно в «Ещё» → «Разметка фото».", "Frame names are read automatically. You can turn this off in More → Photo labeling.", "Raami nimetus loetakse automaatselt. Välja saab selle lülitada: Veel → Fotode märgistamine."],["Автораспознавание выключено. Включить снова — «Ещё» → «Разметка фото».", "Auto-reading is off. Turn it back on in More → Photo labeling.", "Automaatne lugemine on välja lülitatud. Uuesti sisse: Veel → Fotode märgistamine."],["Автораспознавание выключено — название читает кнопка «Прочитать». Включить можно в «Ещё» → «Разметка фото».", "Auto-reading is off — names are read with the «Read text» button. Turn it on in More → Photo labeling.", "Automaatne lugemine on välja lülitatud — nimetuse loeb nupp «Loe tekst». Sisse saab selle lülitada: Veel → Fotode märgistamine."],["Автораспознавание включено — новые и изменённые рамки читаются сами.", "Auto-reading is on — new and changed frames are read automatically.", "Automaatne lugemine on sisse lülitatud — uued ja muudetud raamid loetakse ise."],["Верный ответ сам ставит «Хорошо». Выключить можно в «Ещё» → «Вид и удобство».", "A correct answer grades itself «Good». You can turn this off in More → Look & comfort.", "Õige vastus saab ise hinde «Hea». Välja saab selle lülitada: Veel → Välimus ja mugavus."],["Автооценка выключена. Включить снова — «Ещё» → «Вид и удобство».", "Auto-grading is off. Turn it back on in More → Look & comfort.", "Automaatne hindamine on välja lülitatud. Uuesti sisse: Veel → Välimus ja mugavus."],["Верные ответы могут сами ставить «Хорошо». Включить можно в «Ещё» → «Вид и удобство».", "Correct answers can grade themselves «Good». Turn this on in More → Look & comfort.", "Õiged vastused võivad ise saada hinde «Hea». Sisse saab selle lülitada: Veel → Välimus ja mugavus."],["Автооценка включена — верный ответ сам ставит «Хорошо».", "Auto-grading is on — a correct answer grades itself «Good».", "Automaatne hindamine on sisse lülitatud — õige vastus saab ise hinde «Hea»."],["Соседние подписи просвечивают. Выключить можно в «Ещё» → «Вид и удобство».", "Neighbouring labels show through. You can turn this off in More → Look & comfort.", "Naabersildid paistavad läbi. Välja saab selle lülitada: Veel → Välimus ja mugavus."],["Соседние подписи снова закрыты полностью.", "Neighbouring labels are fully covered again.", "Naabersildid on jälle täielikult kaetud."],["Соседние подписи можно сделать полупрозрачными — так легче ориентироваться. Включить можно в «Ещё» → «Вид и удобство».", "Neighbouring labels can be made see-through — it helps you find your way. Turn this on in More → Look & comfort.", "Naabersildid saab muuta poolläbipaistvaks — nii on lihtsam orienteeruda. Sisse saab selle lülitada: Veel → Välimus ja mugavus."],["Соседние подписи теперь чуть просвечивают.", "Neighbouring labels now show through slightly.", "Naabersildid paistavad nüüd veidi läbi."],["Конфетти и анимации можно выключить — «Спокойный режим» в «Ещё» → «Вид и удобство».", "Confetti and animations can be turned off — «Calm mode» in More → Look & comfort.", "Konfeti ja animatsioonid saab välja lülitada — «Rahulik režiim» jaotises Veel → Välimus ja mugavus."],["Спокойный режим включён — без конфетти и анимаций.", "Calm mode is on — no confetti or animations.", "Rahulik režiim on sisse lülitatud — ilma konfeti ja animatsioonideta."],["Разметка фото", "Photo labeling", "Fotode märgistamine"],["Читать название в рамке автоматически", "Read frame names automatically", "Loe raami nimetus automaatselt"],["Новая рамка, рамка после перемещения или изменения размера и рамка без названия распознаются сами — прямо на устройстве, фото никуда не отправляется. Выключено — читает только кнопка «Прочитать»", "New frames, frames you move or resize, and frames without a name are read automatically — right on the device, the photo isn’t sent anywhere. When off, only the «Read text» button reads.", "Uued raamid, liigutatud või suurust muutnud raamid ja nimetuta raamid loetakse automaatselt — otse seadmes, fotot kuhugi ei saadeta. Välja lülitatuna loeb ainult nupp «Loe tekst»."],["Плашки о настройках", "Settings tips", "Seadete vihjed"],["На несколько секунд подсказывают, какую функцию можно включить или выключить, — с кнопкой, чтобы сделать это сразу", "For a few seconds, shows which feature can be turned on or off — with a button to do it right away", "Näitab mõneks sekundiks, millise funktsiooni saab sisse või välja lülitada — koos nupuga, et seda kohe teha"]);

/* ---------- persistence: serialized, coalesced per document ---------- */
const WQ={keys:[],jobs:new Map(),busy:false,retries:new Map()};
function getObj(coll,id){if(coll==='decks')return deckById(id);if(coll==='plates')return plateById(id);if(coll==='terms')return cardById(id);if(coll==='stats')return S.stats[id];if(coll==='meta')return META;if(coll==='folders')return folderById(id);return null;}
